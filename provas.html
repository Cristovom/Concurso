<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1120">
<title>Laboratório de Provas — Revisa TI</title>
<style>
:root{color-scheme:dark;--bg:#0a0f1c;--panel:#151f30;--pane2:#1b283a;--border:#2a384b;--text:#f0f4fc;--muted:#a1aec1;--accent:#6fe0ba;--red:#f19b9c;--yellow:#e6ad6d;--blue:#8db8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.52 Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}a{color:var(--accent)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.container{max-width:1340px;padding:26px clamp(16px,4vw,55px) 100px;margin:auto}.top{display:flex;gap:20px;justify-content:space-between;align-items:center;margin-bottom:32px;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center;color:var(--text);text-decoration:none}.brandmark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--accent);font-size:14px;font-weight:900;color:#092a20}.brand strong{font-size:17px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.6px}.headright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.version{font-size:11px;border:1px solid var(--border);padding:7px 11px;border-radius:100px;color:var(--muted)}.eyebrow{font-weight:800;font-size:11px;letter-spacing:1.7px;color:var(--accent);text-transform:uppercase}.title{font-size:clamp(26px,3.5vw,41px);letter-spacing:-1.2px;line-height:1.16;margin:7px 0 9px}.sub{color:var(--muted);max-width:880px;margin:0 0 25px}.btn{border:1px solid var(--border);color:var(--text);background:var(--pane2);display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:10px 14px;text-decoration:none;border-radius:10px;font-weight:720;line-height:1.3}.btn:hover{border-color:#8e9fb4}.btn.primary{border-color:transparent;background:var(--accent);color:#08271f}.btn.danger{color:var(--red)}.btn:disabled{opacity:.48;cursor:not-allowed}.btn.ghost{background:none}.btn.small{padding:7px 10px;font-size:12px}.card{border:1px solid var(--border);background:var(--panel);border-radius:18px;padding:22px;min-width:0}.card h2{font-size:19px;letter-spacing:-.4px;margin:0 0 8px}.card p{color:var(--muted);margin:0 0 15px}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.stat{background:var(--pane2);border:1px solid var(--border);border-radius:13px;padding:13px}.stat b{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}.pill{font-weight:740;font-size:11px;background:#17352e;color:var(--accent);padding:6px 11px;border-radius:99px}.pillyellow{background:#30271a;color:var(--yellow)}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap}.divider{height:1px;background:var(--border);margin:19px 0}.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.notice{padding:13px 15px;background:#1d2a3b;border:1px solid var(--border);color:var(--muted);border-radius:12px;margin-top:13px;font-size:12px}.notice strong{color:var(--text)}.progress{background:var(--pane2);height:8px;border-radius:40px;overflow:hidden}.progress>div{height:100%;background:var(--accent);border-radius:40px}.grid-questions{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.qnum{border:1px solid var(--border);border-radius:8px;min-height:39px;background:var(--pane2);color:var(--muted);font-weight:750}.qnum.active{border:2px solid var(--accent);color:var(--accent)}.qnum.done{background:#1b453c;color:var(--accent)}.qnum.flag{box-shadow:inset 0 -3px var(--yellow)}.formrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.option{background:var(--pane2);border:1px solid var(--border);border-radius:12px;min-width:45px;min-height:49px;color:var(--text);font-weight:800;font-size:17px}.option.selected{background:#164b3d;border:2px solid var(--accent);color:var(--accent)}.option:disabled{cursor:default}.label{display:block;margin-bottom:8px;font-size:12px;color:var(--muted);font-weight:700}.field{width:100%;background:#0f1726;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:12px;resize:vertical;min-height:76px}.exam-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(370px,.9fr);gap:15px;align-items:start}.sticky{position:sticky;top:12px}.pdfbox{height:620px;background:#0c1320;border:1px solid var(--border);border-radius:11px;overflow:hidden}.pdfbox iframe{border:0;width:100%;height:100%}.qcontent{margin:17px 0}.qcontent h2{margin-bottom:5px}.wrong{border-left:3px solid var(--red)}.right{border-left:3px solid var(--accent)}.barrow{display:grid;grid-template-columns:190px 1fr 65px;gap:9px;align-items:center;margin:9px 0;font-size:12px}.barrow .progress{height:8px}.barrow strong{text-align:right}.error-list{display:grid;gap:12px}.err-title{font-size:14px;font-weight:750}.badge{border-radius:20px;padding:4px 8px;background:var(--pane2);font-size:11px;font-weight:700;color:var(--muted)}.buttonline{display:flex;gap:8px;flex-wrap:wrap}.a11y{position:absolute;left:-9999px}.empty{text-align:center;border:1px dashed var(--border);padding:38px 22px;border-radius:15px;color:var(--muted)}.statusmsg{padding:11px;border-radius:10px;background:#102c27;color:var(--accent);margin:12px 0}.questionpanel{display:flex;flex-direction:column;gap:12px}.smallicon{font-size:16px}.footer{border-top:1px solid var(--border);margin-top:42px;padding:16px 0;color:var(--muted);font-size:11px}.pdfmobile{display:none}.inlinehelp{font-size:12px;color:var(--muted);margin-top:5px}.page-ref{font-size:11px;border:1px solid var(--border);border-radius:99px;padding:6px 10px;color:var(--muted)}
@media(max-width:900px){.exam-layout{grid-template-columns:1fr}.sticky{position:static}.pdfbox{height:450px}.cols,.three{grid-template-columns:1fr}.grid-questions{grid-template-columns:repeat(10,1fr)}}
@media(max-width:600px){.container{padding:16px 14px 95px}.top{margin-bottom:20px}.card{padding:16px}.grid-questions{grid-template-columns:repeat(5,1fr)}.pdfbox{display:none}.pdfmobile{display:block}.barrow{grid-template-columns:115px 1fr 44px;gap:6px}.title{font-size:27px}.btn{padding:10px 11px}.headright{width:100%}.option{flex:1}.version{display:none}.formrow{flex-wrap:nowrap}}
</style>
</head>
<body><main class="container"><header class="top"><a class="brand" href="./index.html"><span class="brandmark">RT</span><span><strong>Revisa TI</strong><small>LABORATÓRIO DE PROVAS</small></span></a><div class="headright"><a class="btn small ghost" href="./index.html">← Flashcards</a><button class="btn small" id="downloadbackup">Exportar histórico</button><label class="btn small" for="uploadbackup">Importar histórico<input id="uploadbackup" type="file" accept=".json,application/json" style="display:none"></label><span class="version">Versão 1.2.0</span></div></header><div id="root"><div class="card">Carregando biblioteca de provas…</div></div><footer class="footer">Provas e editais de concursos anteriores fornecidos pelo usuário. Questões oficiais ficam nos respectivos PDFs, sem transcrição no site. O progresso é salvo apenas neste navegador.</footer></main>
<script>
'use strict';
const KEY='revisati-oficiais-v1';const CHOICES=['A','B','C','D','E'];
let data={},store={attempts:{sbc:[],santo:[]},current:{sbc:null,santo:null}},activeExam=null,activeN=1,tab='home',showOfficialKey=false,nowStamp=null;
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));return true}catch(e){alert('Não foi possível guardar o histórico. Exporte um backup e verifique o armazenamento.');return false}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.attempts&&x.current){store=x;store.attempts.sbc||=[];store.attempts.santo||=[]}}catch(e){}}
function session(k){return store.current[k]}
function day(s){return new Date(s).toLocaleDateString('pt-BR',{dateStyle:'short',timeStyle:'short'})}
function perc(c,t){return t?Math.round(c/t*100):0}
function button(text,fn,cls=''){return `<button class="btn ${cls}" data-action="${fn}">${text}</button>`}
function relevantResults(k){return store.attempts[k]||[]}
function start(k){if(!data[k])return;if(session(k)&&!session(k).finishedAt){if(!confirm('Já há uma prova em andamento. Deseja retomá-la?'))return;activeExam=k;activeN=1;tab='take';render();return}
 if(session(k)&&session(k).finishedAt){activeExam=k;tab='result';render();return}
 store.current[k]={startedAt:Date.now(),finishedAt:null,answers:{},flags:{},notes:{},confidence:{}};save();activeExam=k;activeN=1;tab='take';render()}
function fresh(k){if(!confirm('Iniciar outra tentativa? A anterior permanece no histórico.'))return;store.current[k]={startedAt:Date.now(),finishedAt:null,answers:{},flags:{},notes:{},confidence:{}};save();activeExam=k;activeN=1;tab='take';render()}
function stats(k,s){const q=data[k].questions;let correct=0,answered=0,cats={},topics={},domains={},wrong=[];
 for(let item of q){let a=s.answers[item.n],good=a===item.answer;if(a)answered++;if(good)correct++;else wrong.push(item);for(let [obj,key] of [[cats,item.subject],[topics,item.topic],[domains,item.domain||item.subject]]){obj[key]??={correct:0,total:0};obj[key].total++;if(good)obj[key].correct++}}return {correct,answered,cats,topics,domains,wrong}}
function subjectsHTML(smap){return Object.entries(smap).map(([name,v])=>`<div class="barrow"><span title="${esc(name)}">${esc(name)}</span><div class="progress"><div style="width:${perc(v.correct,v.total)}%"></div></div><strong>${v.correct}/${v.total}</strong></div>`).join('')}
function formatTime(t){let secs=Math.max(0,Math.floor(t/1000));return `${String(Math.floor(secs/3600)).padStart(2,'0')}:${String(Math.floor(secs%3600/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`}
function sourceDocs(k,finished){const d=data[k];return `<div class="actions"><a class="btn small" href="./${esc(d.provaUrl)}" target="_blank" rel="noopener">Caderno original PDF (${d.provaSize} MB)</a><a class="btn small ghost" href="./${esc(d.editalUrl)}" target="_blank" rel="noopener">Edital PDF (${d.editalSize} MB)</a>${finished?`<a class="btn small ghost" target="_blank" rel="noopener" href="./${esc(d.gabaritoUrl)}${k==='santo'?'#page=17':''}">Gabarito oficial PDF</a>`:`<button class="btn small ghost" data-action="key-${k}">Consultar gabarito (spoiler)</button>`}</div>`}
function home(){return `<div class="eyebrow">TREINO BASEADO NO EDITAL IPREJUN 2027</div><h1 class="title">Seu laboratório de provas</h1><p class="sub">Três simulados diagnósticos autorais e dois cadernos autênticos da VUNESP (2024), com folha de respostas, correção por gabarito oficial, histórico, análise por subtema e conversão de erros em flashcards.</p>
<div class="three" style="margin-bottom:22px"><div class="stat"><b>3</b><span>Simulados autorais (150 questões)</span></div><div class="stat"><b>2</b><span>Provas oficiais (100 questões)</span></div><div class="stat"><b>6</b><span>PDFs originais: 2 editais, 2 provas, 2 gabaritos</span></div></div>
<section class="card" style="margin-bottom:18px"><div class="row"><div><span class="eyebrow">ETAPA 1</span><h2>Simulados diagnósticos</h2><p>Três provas inéditas, 50 questões cada, seguindo o formato IPREJUN. Seu histórico permanece na ferramenta de simulados já utilizada.</p></div><a class="btn primary" href="./simulados.html">Abrir os 3 simulados →</a></div><div class="notice"><strong>Ordem sugerida:</strong> antes de estudar os assuntos com flashcards, conclua os três diagnósticos para medir o conhecimento prévio sem contaminação do treino.</div></section>
<div class="eyebrow" style="margin:24px 0 12px">ETAPA 2 · PROVAS ORIGINAIS DA BANCA</div><div class="cols">${Object.entries(data).map(([k,d])=>{let s=session(k),n=relevantResults(k).length;return `<div class="card"><div class="row"><span class="pill">Código ${esc(d.code)} · ${esc(d.date)}</span><span class="small">${d.time} min · 50 questões</span></div><h2 style="margin-top:14px">${esc(d.name)}</h2><p>${esc(d.title)}</p><div class="notice" style="margin-bottom:14px"><strong>Distribuição:</strong> ${k==='sbc'?'10 Português · 10 Matemática · 5 Lógica · 25 TI':'15 Português · 10 Matemática · 5 Lógica · 20 TI'}</div><div class="actions"><button class="btn primary" data-action="start-${k}">${s?(s.finishedAt?'Ver resultado / nova tentativa':'Continuar prova'):'Iniciar prova'} →</button><button class="btn small" data-action="library-${k}">Arquivos do concurso</button></div><div class="small" style="margin-top:14px">${n?`${n} tentativa(s) finalizada(s). Última: ${day(relevantResults(k).at(-1).finishedAt)}`:'Nenhuma tentativa finalizada.'}</div></div>`}).join('')}</div><div class="notice"><strong>Importante:</strong> durante a prova consulte o caderno PDF e marque A–E na folha de respostas. O gabarito é mostrado após finalizar; as questões oficiais não foram substituídas por reescritas da IA.</div>
<div style="margin-top:17px" class="actions"><button class="btn" data-action="offline">Preparar os PDFs para uso offline</button><button class="btn" data-action="history">Histórico e desempenho</button><button class="btn" data-action="export">Exportar respostas</button></div>`}
function library(k){const d=data[k];return `<a href="#" data-action="home" class="small">← Todas as provas</a><div class="eyebrow" style="margin-top:20px">ARQUIVOS AUTÊNTICOS · ${esc(d.code)}</div><h1 class="title">${esc(d.name)}</h1><p class="sub">Arquivos fornecidos na conversa e preservados sem alteração. O gabarito disponibilizado é o correspondente ao código da prova.</p><div class="card"><h2>${esc(d.title)}</h2><p>Caderno de 50 questões realizado em ${esc(d.date)}.</p>${sourceDocs(k,Boolean(session(k)?.finishedAt))}<div class="divider"></div><p class="small">O edital anexado pode conter outras especialidades ou retificações, pois foi publicado para o concurso completo. Para treinar, utilize o código ${esc(d.code)} na identificação do caderno e do gabarito.</p><div class="actions"><button class="btn primary" data-action="start-${k}">Abrir folha de respostas</button><button class="btn" data-action="offline">Salvar PDFs para uso offline</button></div></div>`}
function take(k){const d=data[k],s=session(k);if(!s){tab='home';return home()};if(s.finishedAt){tab='result';return result(k)}const itm=d.questions[activeN-1],filled=Object.keys(s.answers).length,runTime=Date.now()-s.startedAt;return `<div class="row" style="margin-bottom:10px"><button class="btn small ghost" data-action="home">← Biblioteca</button><span class="pill">Prova ${esc(d.code)} · Em andamento</span></div><h1 class="title" style="font-size:29px">${esc(d.name)}</h1><div class="row" style="margin-bottom:13px"><span class="small"><span id="answered-count">${filled}</span>/50 respondidas</span><span class="page-ref">Restam <b id="clock">${formatTime(d.time*60000-runTime)}</b></span></div><div class="progress" style="margin-bottom:18px"><div id="answer-progress" style="width:${filled*2}%"></div></div>
<div class="exam-layout"><section class="card"><div class="row"><h2>Caderno original — PDF</h2><a class="btn small" target="_blank" rel="noopener" id="pdf-open" href="./${esc(d.provaUrl)}#page=${itm.page}">Abrir PDF ↗</a></div><p>Leia a questão ${activeN} na página <strong>${itm.page}</strong> do PDF. O texto e eventuais figuras permanecem na versão original da banca.</p><div class="pdfbox"><iframe title="Caderno original VUNESP ${esc(d.code)}" id="pdf-frame" src="./${esc(d.provaUrl)}#page=${itm.page}&zoom=100" loading="lazy"></iframe></div><div class="pdfmobile"><div class="notice">Em celulares, abra o PDF em outra aba e volte à folha de respostas para marcar a alternativa. O navegador pode não oferecer visualizador de PDF incorporado.</div></div></section>
<section class="card sticky questionpanel"><div class="row"><div><span class="eyebrow">FOLHA DE RESPOSTAS</span><h2 style="font-size:20px">Questão ${activeN} / 50</h2></div><span class="page-ref">Pág. ${itm.page}</span></div><div class="small">${esc(itm.subject)} · ${esc(itm.topic)}</div><div class="formrow">${CHOICES.map(letter=>`<button class="option ${s.answers[activeN]===letter?'selected':''}" data-action="answer-${letter}" aria-label="Alternativa ${letter}" aria-pressed="${s.answers[activeN]===letter}">${letter}</button>`).join('')}</div><label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="flag" ${s.flags[activeN]?'checked':''}> Marcar para revisar / respondi com dúvida</label><div class="divider" style="margin:2px 0"></div><div class="grid-questions">${d.questions.map(q=>`<button class="qnum ${s.answers[q.n]?'done':''} ${q.n===activeN?'active':''} ${s.flags[q.n]?'flag':''}" data-action="q-${q.n}" aria-label="Ir à questão ${q.n}">${q.n}</button>`).join('')}</div><div class="buttonline"><button class="btn" data-action="prev" ${activeN===1?'disabled':''}>Anterior</button><button class="btn" data-action="next" ${activeN===50?'disabled':''}>Próxima →</button><button class="btn danger" data-action="finish-${k}">Finalizar prova</button></div><div class="notice">O gabarito não é exibido durante esta tentativa. Suas marcações ficam salvas automaticamente no navegador.</div></section></div>`}
function result(k){const s=session(k),d=data[k];if(!s?.finishedAt){tab='take';return take(k)}const r=stats(k,s);return `<button class="btn small ghost" data-action="home">← Biblioteca</button><div class="eyebrow" style="margin-top:21px">RESULTADO OFICIAL DA TENTATIVA</div><h1 class="title">${esc(d.name)}</h1><p class="sub">Corrigido conforme o gabarito do código ${esc(d.code)}. Resultado de treino, não pontuação de classificação do IPREJUN.</p><div class="three"><div class="stat"><b style="color:var(--accent)">${r.correct}/50</b><span>Acertos · ${r.correct*2}%</span></div><div class="stat"><b>${r.answered}/50</b><span>Questões respondidas</span></div><div class="stat"><b>${formatTime(s.finishedAt-s.startedAt)}</b><span>Tempo decorrido</span></div></div>
<div class="cols" style="margin-top:17px"><div class="card"><h2>Por disciplina</h2>${subjectsHTML(r.cats)}<div class="divider"></div><h2>Por área de TI</h2>${subjectsHTML(Object.fromEntries(Object.entries(r.domains).filter(([key])=>!['Língua Portuguesa','Matemática','Raciocínio Lógico'].includes(key))))}<div class="divider"></div><h2>Por tópico específico</h2>${subjectsHTML(Object.fromEntries(Object.entries(r.topics).filter(([key])=>!['Língua Portuguesa','Matemática','Raciocínio Lógico'].includes(key))))}</div><div class="card"><h2>Caderno de erros</h2><p>${r.wrong.length} questões incorretas ou sem resposta. Para cada uma, registre o erro conceitual e crie um cartão de revisão com suas próprias palavras.</p><div class="actions"><button class="btn primary" data-action="errors-${k}">Revisar questões →</button><button class="btn" data-action="fresh-${k}">Nova tentativa</button></div><div class="divider"></div><h2>Documentos oficiais</h2>${sourceDocs(k,true)}<div class="notice">O gabarito completo foi liberado porque esta tentativa já foi finalizada. O caderno permanece disponível no PDF original.</div></div></div>`}
function analyze(k){const s=session(k),d=data[k];if(!s?.finishedAt){tab='take';return take(k)}let r=stats(k,s);return `<div class="row"><div><span class="eyebrow">CADERNO DE ERROS · ${esc(d.code)}</span><h1 class="title">Analise seus distratores</h1><p class="sub">A alternativa correta não é suficiente: descubra qual conceito eliminaria cada opção incorreta. Sua explicação pode virar um flashcard de repetição espaçada.</p></div><button class="btn" data-action="result-${k}">Voltar ao resultado</button></div><div class="error-list">${r.wrong.length?r.wrong.map(q=>{let n=s.notes[q.n]||{};return `<article class="card wrong"><div class="row"><span class="err-title">Questão ${q.n} · ${esc(q.topic)}</span><span class="badge">Página ${q.page}</span></div><p class="small">${esc(q.subject)} · Resposta marcada: <strong>${esc(s.answers[q.n]||'Em branco')}</strong> · Gabarito oficial: <strong style="color:var(--accent)">${esc(q.answer)}</strong></p><div class="actions" style="margin-bottom:14px"><a class="btn small" target="_blank" rel="noopener" href="./${esc(d.provaUrl)}#page=${q.page}">Abrir questão no PDF ↗</a></div><label class="label" for="why-${q.n}">Qual foi sua confusão? Por que os distratores pareciam plausíveis?</label><textarea class="field" id="why-${q.n}" data-note="why" data-n="${q.n}" placeholder="Ex.: confundi NAT com redirecionamento de portas…">${esc(n.why||'')}</textarea><label class="label" for="learn-${q.n}" style="margin-top:10px">O que você precisa lembrar? (formule a resposta correta)</label><textarea class="field" id="learn-${q.n}" data-note="learn" data-n="${q.n}" placeholder="Ex.: escreva um conceito curto e tecnicamente preciso.">${esc(n.learn||'')}</textarea><div class="buttonline" style="margin-top:12px"><button class="btn small primary" data-action="flash-${k}-${q.n}">Criar flashcard da revisão</button><span class="small" id="cardstatus-${q.n}">${n.flashcard?'Cartão de revisão já criado.':''}</span></div></article>`}).join(''):'<div class="empty">Você acertou todas as questões. Excelente resultado neste caderno.</div>'}</div>`}
function history(){return `<button class="btn small ghost" data-action="home">← Biblioteca</button><div class="eyebrow" style="margin-top:22px">SEU HISTÓRICO</div><h1 class="title">Desempenho nas provas oficiais</h1><div class="cols">${Object.entries(data).map(([k,d])=>`<div class="card"><h2>${esc(d.name)}</h2>${relevantResults(k).length?`<div class="error-list">${relevantResults(k).map((a,i)=>{let r=stats(k,a);return `<div class="row"><span class="small">Tentativa ${i+1} · ${day(a.finishedAt)}</span><b>${r.correct}/50 · ${r.correct*2}%</b></div>`}).join('')}</div>`:'<p>Sem tentativas concluídas.</p>'}</div>`).join('')}</div><div class="notice">Histórico guardado no dispositivo, separado dos 154 flashcards já existentes. Use “Exportar histórico” para salvá-lo em JSON.</div>`}
function render(){if(tab==='home')$('root').innerHTML=home();else if(tab==='library')$('root').innerHTML=library(activeExam);else if(tab==='take')$('root').innerHTML=take(activeExam);else if(tab==='result')$('root').innerHTML=result(activeExam);else if(tab==='errors')$('root').innerHTML=analyze(activeExam);else if(tab==='history')$('root').innerHTML=history()}
function go(t,k){if(k)activeExam=k;tab=t;window.scrollTo(0,0);render()}
function finish(k){const s=session(k),missing=50-Object.keys(s.answers).length;if(missing&&!confirm(`Há ${missing} questões sem resposta. Finalizar mesmo assim?`))return;if(!confirm('Confirma encerrar? O gabarito será revelado e esta tentativa será arquivada.'))return;s.finishedAt=Date.now();store.attempts[k].push(JSON.parse(JSON.stringify(s)));save();go('result',k)}
function downloadJSON(filename,data){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function offline(){if(!('caches'in window)){alert('Este navegador não suporta armazenamento offline de arquivos.');return}const list=['./simulados.html',...Object.values(data).flatMap(d=>[d.provaUrl,d.editalUrl,d.gabaritoUrl])].map(u=>new URL(u,location.href).href);if(!confirm('Salvar dois editais, duas provas, dois gabaritos e simulados no cache deste dispositivo (~6 MB)? Requer conexão agora.'))return;const cacheName='revisati-offline-docs-v1.2';caches.open(cacheName).then(async cache=>{let ok=0;for(const url of list){try{await cache.add(new Request(url,{cache:'reload'}));ok++}catch(e){console.warn('Cache failure',url,e)}}alert(`${ok} de ${list.length} arquivos salvos. O armazenamento offline é controlado pelo navegador e pode ser liberado automaticamente pelo sistema.`)}).catch(err=>alert('Falha ao preparar documentos offline: '+err.message))}
function flash(k,n){const s=session(k),q=data[k].questions[n-1],notes=s.notes[n]||{},front=(notes.why||'').trim(),back=(notes.learn||'').trim();if(!front||!back){alert('Preencha os dois campos: o erro ou dúvida e a explicação correta. Isso evita criar cartões que apenas decoram a letra do gabarito.');return}const src=`VUNESP ${data[k].name} · prova ${data[k].code} · questão ${n}`;const item={front:`Qual conceito elimina o erro que cometi na questão ${n} (${q.topic})?\n${front}`,back,source:src,topic:q.topic,tags:'vunesp, erro de prova, '+k};
 let inserted=false;const req=indexedDB.open('revisati-iprejun-db',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('state'))req.result.createObjectStore('state')};req.onerror=()=>alert('Não foi possível abrir seus flashcards. Abra o Revisa TI primeiro e, se necessário, exporte backup.');req.onsuccess=()=>{const db=req.result,tx=db.transaction('state','readwrite'),object=tx.objectStore('state'),get=object.get('main');get.onerror=()=>alert('Erro ao acessar o banco de flashcards.');get.onsuccess=()=>{const state=get.result;if(!state||!Array.isArray(state.cards)||!Array.isArray(state.decks)){alert('Abra o Revisa TI e inicialize seus baralhos antes de converter os erros.');return}if(state.cards.some(c=>c.source===src)){alert('Esse cartão já existe no Revisa TI. Edite o conteúdo na Biblioteca, se necessário.');return}let deck=state.decks.find(d=>d.id==='vunesp-erros');if(!deck){deck={id:'vunesp-erros',name:'Erros das provas VUNESP',description:'Questões que você errou e explicou com suas próprias palavras.',color:'#ec9e6a',icon:'cards',createdAt:Date.now()};state.decks.push(deck)}let tm=Date.now();state.cards.push({id:(crypto.randomUUID?crypto.randomUUID():'v-'+tm+'-'+n),deckId:deck.id,front:item.front,back:item.back,topic:item.topic,tags:item.tags,source:item.source,createdAt:tm,dueAt:tm,interval:0,ease:2.5,reps:0,lapses:0,totalReviews:0,suspended:false,lastReviewed:null});object.put(state,'main');inserted=true};tx.oncomplete=()=>{db.close();if(!inserted)return;s.notes[n]={...notes,flashcard:true};save();const el=$('cardstatus-'+n);if(el)el.textContent='Adicionado ao baralho Erros das provas VUNESP.'};tx.onerror=()=>alert('Falha ao salvar o cartão no Revisa TI. Tente novamente.')}}
$('downloadbackup').addEventListener('click',()=>downloadJSON('revisati-provas-oficiais-backup-'+new Date().toISOString().slice(0,10)+'.json',{version:1,exportedAt:new Date().toISOString(),store}));
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;ev.preventDefault();let a=el.dataset.action;if(a==='home')return go('home');if(a==='history')return go('history');if(a==='export')return downloadJSON('revisati-respostas-oficiais.json',{version:1,store});if(a==='offline')return offline();if(a==='prev'){activeN=Math.max(1,activeN-1);return render()}if(a==='next'){activeN=Math.min(50,activeN+1);return render()}if(a.startsWith('q-')){activeN=+a.slice(2);return render()}if(a.startsWith('start-'))return start(a.slice(6));if(a.startsWith('library-'))return go('library',a.slice(8));if(a.startsWith('result-'))return go('result',a.slice(7));if(a.startsWith('errors-'))return go('errors',a.slice(7));if(a.startsWith('fresh-'))return fresh(a.slice(6));if(a.startsWith('finish-'))return finish(a.slice(7));if(a.startsWith('answer-')){let s=session(activeExam);if(!s?.finishedAt){s.answers[activeN]=a.slice(7);save();document.querySelectorAll('.option').forEach(b=>{let v=b.dataset.action.slice(7),selected=v===s.answers[activeN];b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))});let q=document.querySelector('.qnum.active');if(q)q.classList.add('done');let count=$('answered-count');if(count)count.textContent=String(Object.keys(s.answers).length);let progress=$('answer-progress');if(progress)progress.style.width=(Object.keys(s.answers).length*2)+'%'}return}if(a.startsWith('flash-')){let parts=a.split('-');return flash(parts[1],+parts[2])}if(a.startsWith('key-')){const k=a.slice(4);if(confirm('Abrir o gabarito antes de terminar invalida o diagnóstico. Deseja continuar?'))window.open('./'+data[k].gabaritoUrl+(k==='santo'?'#page=17':''),'_blank','noopener');return}});
document.addEventListener('change',ev=>{if(ev.target.id==='flag'&&session(activeExam)){session(activeExam).flags[activeN]=ev.target.checked;save();let btn=document.querySelector('.qnum.active');if(btn)btn.classList.toggle('flag',ev.target.checked)}});
document.addEventListener('input',ev=>{let el=ev.target;if(!el.dataset.note)return;const s=session(activeExam);if(!s)return;let n=el.dataset.n;s.notes[n]??={};s.notes[n][el.dataset.note]=el.value;save()});
async function boot(){load();try{let response=await fetch('./provas-data.json',{cache:'no-store'});if(!response.ok)throw Error('Não foi possível carregar os gabaritos');data=await response.json();for(let [k,v] of Object.entries(data)){if(v.questions.length!==50||v.questions.some(q=>!CHOICES.includes(q.answer)))throw Error('Dados inválidos na prova '+k)}let url=new URL(location.href);let exam=url.searchParams.get('exam');if(exam&&data[exam]){activeExam=exam;if(session(exam))tab=session(exam).finishedAt?'result':'take';else tab='library'}render()}catch(e){$('root').innerHTML=`<div class="card"><h2>Erro na biblioteca</h2><p>${esc(e.message)}. Verifique se todos os arquivos do ZIP foram publicados na mesma pasta.</p><a class="btn" href="./index.html">Voltar ao Revisa TI</a></div>`}}
$('uploadbackup').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;try{const payload=JSON.parse(await file.text());const next=payload.store||payload;if(!next||!next.current||!next.attempts||!Array.isArray(next.attempts.sbc)||!Array.isArray(next.attempts.santo))throw Error('Backup de provas oficiais inválido.');if(!confirm('Restaurar esse backup? O histórico de provas oficiais deste navegador será substituído. Os flashcards não serão modificados.'))return;store=next;save();go('home');alert('Histórico de provas oficiais restaurado.')}catch(e){alert('Falha ao importar: '+e.message)}finally{event.target.value=''}});
setInterval(()=>{if(tab!=='take'||!activeExam||!data[activeExam])return;const s=session(activeExam);if(!s||s.finishedAt)return;let remaining=data[activeExam].time*60000-(Date.now()-s.startedAt);let clock=$('clock');if(clock)clock.textContent=formatTime(remaining);if(remaining<=0){s.finishedAt=Date.now();store.attempts[activeExam].push(JSON.parse(JSON.stringify(s)));save();go('result',activeExam);alert('O tempo da prova terminou. Sua folha de respostas foi corrigida.')}},1000);
boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
