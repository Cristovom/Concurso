ite, Domain, Organizational Unit (Local, Site, Domínio, OU).","topic":"GPO","tags":""},{"front":"Qual comando Windows atualiza políticas de grupo manualmente?","back":"gpupdate /force (força nova aplicação das políticas).","topic":"GPO","tags":""},{"front":"Qual comando Windows exibe informações de políticas aplicadas?","back":"gpresult (por exemplo, gpresult /r).","topic":"GPO","tags":""},{"front":"Qual é a utilidade principal de permissões NTFS?","back":"Controlar leitura, gravação, execução e outros acessos a arquivos e pastas em volumes NTFS.","topic":"Windows Server","tags":""},{"front":"Qual a diferença entre permissão de compartilhamento e NTFS?","back":"A de compartilhamento regula acesso via rede; NTFS regula acesso ao sistema de arquivos. No acesso remoto, prevalece o conjunto efetivo mais restritivo.","topic":"Windows Server","tags":""},{"front":"O que é DNS integrado ao Active Directory?","back":"Zona DNS cujos dados podem ser armazenados e replicados pelo AD DS.","topic":"Windows Server","tags":""},{"front":"Para que serve o PowerShell?","back":"Shell e linguagem de automação para administrar sistemas e serviços, incluindo Windows Server.","topic":"Windows Server","tags":""},{"front":"Qual comando mostra o diretório atual no Linux?","back":"pwd.","topic":"Linux","tags":""},{"front":"Qual comando lista arquivos e diretórios no Linux?","back":"ls (por exemplo, ls -la para visão detalhada, incluindo ocultos).","topic":"Linux","tags":""},{"front":"Qual comando altera permissões de arquivos no Linux?","back":"chmod.","topic":"Linux","tags":""},{"front":"Qual comando muda o proprietário de arquivo no Linux?","back":"chown.","topic":"Linux","tags":""},{"front":"Qual comando consulta o estado de um serviço em sistemas systemd?","back":"systemctl status nome-do-servico.","topic":"Linux","tags":""},{"front":"O que representa a permissão Unix 755?","back":"Dono: leitura/escrita/execução (7); grupo e outros: leitura/execução (5).","topic":"Linux","tags":""},{"front":"O que é sudo?","back":"Comando que permite executar ações com privilégios de outra conta, normalmente superusuário, conforme autorização.","topic":"Linux","tags":""},{"front":"Para que serve o arquivo /etc/hosts?","back":"Mapear localmente nomes de host para endereços IP.","topic":"Linux","tags":""},{"front":"Qual o papel do diretório /var/log?","back":"Armazenar diversos logs de serviços e do sistema, conforme configuração.","topic":"Linux","tags":""},{"front":"Qual é a função principal da memória RAM?","back":"Manter temporariamente dados e instruções usados por programas em execução.","topic":"Hardware","tags":""},{"front":"Qual a diferença entre SSD e HDD?","back":"SSD utiliza memória de estado sólido; HDD utiliza pratos magnéticos mecânicos.","topic":"Hardware","tags":""},{"front":"Para que serve RAID 1?","back":"Espelhamento de dados entre unidades, oferecendo redundância, mas não substituindo backup.","topic":"Hardware","tags":""},{"front":"Qual a função do BIOS/UEFI?","back":"Inicializar o hardware e fornecer a interface de firmware para iniciar o sistema operacional.","topic":"Hardware","tags":""},{"front":"O que é virtualização?","back":"Execução de ambientes virtuais isolados sobre recursos físicos compartilhados, mediada por hipervisor.","topic":"Sistemas","tags":""},{"front":"O que é um serviço (daemon) em sistemas operacionais?","back":"Processo que executa funções de sistema em segundo plano, geralmente gerenciado pelo sistema.","topic":"Sistemas","tags":""},{"front":"Para que serve o log de eventos do Windows?","back":"Registrar eventos de segurança, sistema, aplicativos e outros para análise e diagnóstico.","topic":"Sistemas","tags":""}]},{"name":"Segurança e conectividade","slug":"seguranca","icon":"shield","description":"Firewall, criptografia, VPN IPsec, IDS/IPS e certificados.","color":"#ea9c60","cards":[{"front":"Quais são os três pilares da segurança da informação (CIA)?","back":"Confidencialidade, Integridade e Disponibilidade.","topic":"F const ICON={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M9 21v-8h6v8"/>',cards:'<rect x="3" y="5" width="16" height="15" rx="2"/><path d="M7 3h13a1 1 0 0 1 1 1v13"/><path d="M7 10h8M7 14h5"/>',library:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M11 9h7M11 13h5"/>',import:'<path d="M12 3v12m-4-4 4 4 4-4"/><path d="M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>',stats:'<path d="M4 20V11m5 9V4m5 16v-7m5 7V8"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.3.9a7 7 0 0 0-1.7-1L14.5 3h-4L10 5.9a7 7 0 0 0-1.7 1L6 6l-2 3.5L6 11a7 7 0 0 0 0 2l-2 1.5L6 18l2.3-.9a7 7 0 0 0 1.7 1l.5 2.9h4l.5-2.9a7 7 0 0 0 1.7-1l2.3.9 2-3.5L19 13a7 7 0 0 0 0-1Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>',moon:'<path d="M20.9 13.5A9 9 0 0 1 10.5 3.1 9 9 0 1 0 20.9 13.5Z"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',edit:'<path d="M12 20h9M4 20l4-1 11-11-3-3L5 16z"/>',trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m5 4v6m4-6v6"/>',check:'<path d="m4 12 5 5L20 6"/>',undo:'<path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-1 .5-1 1-1 2.2M12 17h.01"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v3h16v-3"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',pause:'<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',play:'<path d="m7 4 13 8-13 8z"/>',layers:'<path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/>'};
function icon(name){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]||ICON.cards}</svg>`}
const seedPacks=JSON.parse(document.getElementById('seed-data').textContent);
const NAV=[['home','Hoje','home'],['decks','Baralhos','cards'],['library','Biblioteca','library'],['import','Importar','import'],['simulados','Provas','cards'],['stats','Estatísticas','stats']];
const APP_VERSION='1.3.0';const KEY='revisati_iprejun_2027';let db=null, storageMode='Memória temporária';let state=null, view='home',study=null,undo=null,libraryQuery='',libraryDeck='all',libraryPage=0,activeDeck='all',pendingSave=Promise.resolve(),toastTimer=null;
const tNow=()=>Date.now();const uid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);const dateKey=(d=Date.now())=>{let x=new Date(d);return [x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>safe(s).replace(/\n/g,'<br>');const num=n=>new Intl.NumberFormat('pt-BR').format(n);const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR').trim().replace(/\s+/g,' ');const deckOf=id=>state.decks.find(d=>d.id===id);const download=(name,text,mime='application/json')=>{const url=URL.createObjectURL(new Blob([text],{type:mime+';charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)};
const seeded=()=>{let decks=[],cards=[],now=tNow();for(let pack of seedPacks){const id='builtin-'+pack.slug;decks.push({id,name:pack.name,description:pack.description,color:pack.color,icon:pack.icon,createdAt:now});for(let card of pack.cards){cards.push({id:uid(),deckId:id,front:card.front,back:card.back,topic:card.topic||'',tags:card.tags||'',source:'Conteúdo didático autoral — tema previsto no Anexo II',createdAt:now,dueAt:now,interval:0,ease:2.5,reps:0,lapses:0,totalReviews:0,suspended:false,lastReviewed:null})}}return {version:1,decks,cards,logs:[],settings:{theme:'dark',newLimit:20,reviewLimit:120,dailyGoal:25},createdAt:now}};
function idbOpen(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(Error('Sem IndexedDB'));const req=indexedDB.open('revisati-iprejun-db',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('state'))req.result.createObjectStore('state')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('Banco bloqueado'))})}
function idbRead(){return new Promise((resolve,reject)=>{const q=db.transaction('state','readonly').objectStore('state').get('main');q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>reject(q.error)})}
function idbWrite(value){return new Promise((resolve,reject)=>{const tr=db.transaction('state','readwrite');tr.objectStore('state').put(value,'main');tr.oncomplete=()=>resolve();tr.onerror=()=>reject(tr.error)})}
async function initStorage(){try{db=await idbOpen();storageMode='IndexedDB · neste dispositivo';return await idbRead()}catch(err){db=null;try{localStorage.setItem('__revisa_probe','1');localStorage.removeItem('__revisa_probe');storageMode='Armazenamento local · neste dispositivo';return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){storageMode='Temporário · exporte o backup';return null}}}
function persist(){const snap=JSON.parse(JSON.stringify(state));pendingSave=pendingSave.catch(()=>{}).then(async()=>{try{if(db)await idbWrite(snap);else localStorage.setItem(KEY,JSON.stringify(snap))}catch(err){toast('Não foi possível salvar; exporte um backup.');console.error(err)}});return pendingSave}
function sanitizeState(x){if(!x||!Array.isArray(x.cards)||!Array.isArray(x.decks)||!Array.isArray(x.logs))throw Error('Backup inválido.');if(x.cards.length>250000)throw Error('Backup excede 250 mil cartões por importação.');x.settings={theme:'dark',newLimit:20,reviewLimit:120,dailyGoal:25,...(x.settings||{})};return x}
async function boot(){let loaded=await initStorage();try{state=loaded?sanitizeState(loaded):seeded()}catch(e){state=seeded();toast('Backup local inválido; dados iniciais carregados.')}if(!loaded)await persist();if(state.settings.theme==='light')document.body.classList.add('light');document.getElementById('store-status').textContent=storageMode;document.getElementById('date-chip').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'});document.getElementById('theme-btn').addEventListener('click',toggleTheme);document.getElementById('settings-btn').addEventListener('click',openSettings);render()}
function toast(message){document.getElementById('toast-container').innerHTML=`<div class="toast" role="status">${safe(message)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast-container').replaceChildren(),3400)}
function toggleTheme(){state.settings.theme=state.settings.theme==='dark'?'light':'dark';document.body.classList.toggle('light',state.settings.theme==='light');persist();render()}
function setView(v){view=v;study=null;window.scrollTo({top:0,behavior:'instant'});render()}
function navRender(){let html=NAV.map(([id,label,ico])=>`<button class="nav-link ${view===id?'active':''}" data-nav="${id}" ${view===id?'aria-current="page"':''}>${icon(ico)}<span>${label}</span></button>`).join('');document.getElementById('desktop-nav').innerHTML=html;document.getElementById('mobile-nav').innerHTML=NAV.map(([id,label,ico])=>`<button class="${view===id?'active':''}" data-nav="${id}" ${view===id?'aria-current="page"':''}>${icon(ico)}<span>${label}</span></button>`).join('');document.getElementById('breadcrumb-current').textContent=({home:'Hoje',decks:'Baralhos',library:'Biblioteca',import:'Importar',stats:'Estatísticas',simulados:'Provas',study:'Revisão'})[view]||'Hoje';document.getElementById('theme-btn').innerHTML=icon(state.settings.theme==='dark'?'sun':'moon');document.getElementById('settings-btn').innerHTML=icon('settings')}
function todayLogs(){const d=dateKey();return state.logs.filter(l=>l.date===d)}function deckCards(id){return state.cards.filter(c=>id==='all'||c.deckId===id)}
function currentCounts(deckId='all'){let a=deckCards(deckId).filter(c=>!c.suspended),due=a.filter(c=>c.totalReviews>0&&c.dueAt<=tNow()).length,fresh=a.filter(c=>c.totalReviews===0).length,learned=a.filter(c=>c.totalReviews>0).length;return{due,fresh,learned,total:a.length}}
function dueTotal(){return currentCounts('all').due}
function todayNew(){return new Set(todayLogs().filter(l=>l.wasNew).map(l=>l.cardId)).size}
function listForSession(deckId='all'){const eligible=deckCards(deckId).filter(c=>!c.suspended),tm=tNow(),due=eligible.filter(c=>c.totalReviews>0&&c.dueAt<=tm).sort((a,b)=>a.dueAt-b.dueAt),fresh=eligible.filter(c=>c.totalReviews===0).sort((a,b)=>a.createdAt-b.createdAt);const reviewed=todayLogs().filter(l=>!l.wasNew).length;const dueLimit=Math.max(0,state.settings.reviewLimit-reviewed),newLimit=Math.max(0,state.settings.newLimit-todayNew());return [...due.slice(0,dueLimit),...fresh.slice(0,newLimit)]}
function sectionHead(title,descr,right=''){return `<div class="title-row"><div><h2>${safe(title)}</h2>${descr?`<p>${safe(descr)}</p>`:''}</div>${right}</div>`}
function deckCard(d){let n=currentCounts(d.id);return `<div class="deck-card" style="--deck:${safe(d.color)}"><div class="deck-top"><div class="deck-badge">${icon(d.icon)}</div><span class="mini-pill">${num(n.total)} cartões</span></div><h3>${safe(d.name)}</h3><p>${safe(d.description||'Baralho personalizado de estudos.')}</p><div class="progress" style="margin-bottom:11px"><div class="progress-fill" style="width:${n.total?Math.round(n.learned/n.total*100):0}%"></div></div><div class="deck-bottom"><span><strong>${n.due}</strong> revisões vencidas</span><span>${n.total?Math.round(n.learned/n.total*100):0}% visto</span></div><div class="deck-actions"><button class="secondary small-btn" data-study="${safe(d.id)}">Revisar ${icon('arrow')}</button><button class="ghost small-btn" data-filter-deck="${safe(d.id)}">Ver cartões</button></div></div>`}
function homeRender(){const c=currentCounts(),logs=todayLogs(),done=logs.length,goal=state.settings.dailyGoal,queue=listForSession();const title=new Date().getHours()<12?'Bom dia!':new Date().getHours()<18?'Boa tarde!':'Boa noite!';return `<div class="eyebrow">SUA PREPARAÇÃO DIÁRIA</div><h1 class="hero-title">${title} Vamos revisar.</h1><p class="lede">Pequenas sessões, lembrança ativa e repetição espaçada. Seu progresso é construído uma resposta por vez.</p><div class="stats-grid"><div class="stat"><div class="stat-top">Vencidos ${icon('clock')}</div><div class="stat-val stat-orange">${num(c.due)}</div><div class="stat-foot">Cartões para revisar</div></div><div class="stat"><div class="stat-top">Novos ${icon('plus')}</div><div class="stat-val stat-blue">${num(c.fresh)}</div><div class="stat-foot">Ainda não estudados</div></div><div class="stat"><div class="stat-top">Feitos hoje ${icon('check')}</div><div class="stat-val stat-accent">${num(done)}</div><div class="stat-foot">Respostas registradas</div></div><div class="stat"><div class="stat-top">Acervo ${icon('layers')}</div><div class="stat-val">${num(state.cards.length)}</div><div class="stat-foot">Em ${num(state.decks.length)} baralhos</div></div></div><div class="study-callout"><div><div class="callout-tag">PRÓXIMA SESSÃO</div><h2>${queue.length?`Você tem ${queue.length} cartões na fila.`:'Fila de hoje concluída.'}</h2><p>${queue.length?'Você vê a pergunta primeiro, tenta lembrar e depois avalia seu desempenho.':'Os próximos cartões aparecerão conforme os intervalos programados. Você também pode criar ou importar conteúdo.'}</p></div><button class="primary" data-study="all" ${queue.length?'':'disabled'}>Começar revisão ${icon('arrow')}</button></div><div class="two-col"><div class="panel"><h3>Meta diária</h3><p>Revisões registradas hoje em relação ao objetivo.</p><div class="progress-row"><span>${done} de ${goal} revisões</span><strong style="color:var(--accent)">${Math.min(100,Math.round(done/goal*100))}%</strong></div><div class="progress"><div class="progress-fill" style="width:${Math.min(100,Math.round(done/goal*100))}%"></div></div><div style="margin-top:18px;display:flex;gap:8px;flex-wrap:wrap"><button class="secondary small-btn" data-nav="decks">Escolher baralho</button><button class="ghost small-btn" data-nav="import">Importar mais questões</button></div></div><div class="panel"><h3>Como revisar</h3><p>O algoritmo agenda sua próxima revisão conforme sua lembrança.</p><div class="help-items"><div><span class="tag">Errei</span> · rever em aproximadamente 10 minutos</div><div><span class="tag">Difícil</span> · intervalo mais curto</div><div><span class="tag">Bom / Fácil</span> · intervalos progressivamente maiores</div></div></div></div><div class="sep"></div>${sectionHead('Seus baralhos','Conteúdo inicial organizado pelo Anexo II do edital.',`<button class="secondary small-btn" data-nav="decks">Ver todos ${icon('arrow')}</button>`)}<div class="deck-grid">${state.decks.slice(0,6).map(deckCard).join('')}</div><div class="notice" style="margin-top:24px"><strong>Privacidade e backup:</strong> o conteúdo fica armazenado neste navegador. Não há sincronização automática entre celular e computador. Exporte um backup JSON regularmente em Configurações.</div>`}
function decksRender(){return `<div class="eyebrow">ORGANIZE SEU CONTEÚDO</div><h1 class="hero-title">Baralhos de estudo</h1><p class="lede">Crie quantos baralhos precisar e mantenha cada tema separado. O conteúdo inicial foi elaborado com base nos tópicos do edital.</p>${sectionHead(`${state.decks.length} baralhos`,'',`<button class="primary small-btn" id="new-deck">${icon('plus')} Novo baralho</button>`)}<div class="deck-grid">${state.decks.map(deckCard).join('')}</div>`}
function libraryRender(){const all=state.cards.filter(c=>{const d=libraryDeck==='all'||c.deckId===libraryDeck;const q=norm(libraryQuery);return d&&(!q||norm([c.front,c.back,c.topic,c.tags,deckOf(c.deckId)?.name].join(' ')).includes(q))}),pageSize=30,totalPages=Math.max(1,Math.ceil(all.length/pageSize));libraryPage=Math.min(libraryPage,totalPages-1);const page=all.slice(libraryPage*pageSize,(libraryPage+1)*pageSize);return `<div class="eyebrow">EDITE SEU ACERVO</div><h1 class="hero-title">Biblioteca de cartões</h1><p class="lede">Pesquise, edite, suspenda ou crie questões. Alterações são salvas automaticamente neste dispositivo.</p><div class="title-row"><h2>${num(all.length)} cartões</h2><button class="primary small-btn" id="new-card">${icon('plus')} Novo cartão</button></div><div class="toolbar"><input class="field search" id="library-search" type="search" placeholder="Buscar perguntas, temas e respostas..." value="${safe(libraryQuery)}" aria-label="Buscar cartões"><select class="select" id="library-deck" aria-label="Filtrar baralho"><option value="all">Todos os baralhos</option>${state.decks.map(d=>`<option value="${safe(d.id)}" ${libraryDeck===d.id?'selected':''}>${safe(d.name)}</option>`).join('')}</select></div><div class="card-list">${page.length?page.map(c=>`<div class="list-card"><div style="min-width:0;flex:1"><div class="meta"><span class="tag">${safe(c.topic||'Geral')}</span> · ${safe(deckOf(c.deckId)?.name||'Sem baralho')} ${c.suspended?'· SUSPENSO':''}</div><div class="q">${safe(c.front)}</div><div class="ans">${safe(c.back)}</div><div class="meta" style="margin-top:8px">${c.totalReviews?`Revisado ${c.totalReviews}× · próximo ${new Date(c.dueAt).toLocaleDateString('pt-BR')}`:'Ainda não revisado'}</div></div><div class="list-actions"><button class="icon-button" aria-label="Editar cartão" title="Editar" data-edit="${safe(c.id)}">${icon('edit')}</button><button class="icon-button" aria-label="${c.suspended?'Reativar':'Suspender'} cartão" title="${c.suspended?'Reativar':'Suspender'}" data-suspend="${safe(c.id)}">${icon(c.suspended?'play':'pause')}</button><button class="icon-button" aria-label="Excluir cartão" title="Excluir" data-delete="${safe(c.id)}">${icon('trash')}</button></div></div>`).join(''):`<div class="empty">Nenhum cartão encontrado neste filtro.</div>`}</div>${totalPages>1?`<div class="pagination"><button class="ghost small-btn" id="page-prev" ${libraryPage===0?'disabled':''}>Anterior</button><span class="small-muted">Página ${libraryPage+1} de ${totalPages}</span><button class="ghost small-btn" id="page-next" ${libraryPage>=totalPages-1?'disabled':''}>Próxima</button></div>`:''}`}
const exampleJSON={deck:'Redes e protocolos',cards:[{front:'O que faz o DHCP?',back:'Distribui endereços IP e outras configurações de rede.',topic:'DHCP',tags:['redes','revisão']},{front:'Qual porta padrão do SSH?',back:'TCP 22.',topic:'Protocolos'}]};
function importRender(){return `<div class="eyebrow">EXPANDA SEU ACERVO</div><h1 class="hero-title">Importar questões</h1><p class="lede">Cole um pacote de cartões que eu gerar aqui no chat ou selecione um arquivo JSON, CSV ou TSV. Cartões com a mesma pergunta no mesmo baralho não são duplicados.</p><div class="two-col"><div class="panel"><h3>1. Selecione o destino</h3><p>Um pacote JSON pode informar o próprio nome do baralho.</p><div class="form-group"><label class="form-label" for="import-deck">Baralho padrão</label><select class="select" id="import-deck">${state.decks.map(d=>`<option value="${safe(d.id)}">${safe(d.name)}</option>`).join('')}</select></div><h3 style="margin-top:24px">2. Cole o conteúdo</h3><p>Formato recomendado: JSON. Também aceita colunas separadas por tabulação ou ponto e vírgula.</p><textarea class="area" id="import-text" spellcheck="false" placeholder='{"deck":"Redes", "cards":[{"front":"Pergunta", "back":"Resposta", "topic":"Tema"}]}'></textarea><div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px"><button class="primary" id="run-import">${icon('import')} Importar cartões</button><label class="secondary file-label">${icon('download')} Selecionar arquivo<input id="import-file" type="file" accept=".json,.txt,.csv,.tsv,application/json,text/plain,text/csv"></label></div><div id="import-feedback" style="margin-top:14px"></div></div><div class="panel"><h3>Pacotes enviados pelo ChatGPT</h3><p>Peça novos cartões por tema. Copie o JSON da resposta e cole no campo de importação.</p><div class="form-group"><label class="form-label">Prompt sugerido para copiar</label><div class="notice">Gere 30 flashcards inéditos sobre [TEMA], seguindo o Anexo II do edital IPREJUN Informática. Retorne somente um JSON válido no formato {"deck":"Nome","cards":[{"front":"...","back":"...","topic":"...","tags":["..."]}]}. Respostas concisas, verificáveis e sem duplicações.</div></div><button class="secondary small-btn" id="copy-prompt">${icon('copy')} Copiar prompt</button><div class="sep"></div><h3>Exemplo de importação</h3><div class="import-example">${safe(JSON.stringify(exampleJSON,null,2))}</div><button class="ghost small-btn" id="copy-example" style="margin-top:12px">${icon('copy')} Copiar exemplo</button><div class="sep"></div><h3>Para questões com alternativas</h3><p>O importador também reconhece campos <strong>options</strong>, <strong>answer</strong> e <strong>explanation</strong>. As alternativas aparecem na frente; resposta e explicação, no verso.</p></div></div>`}
function statsRender(){let log=state.logs,correct=log.filter(l=>l.rating==='good'||l.rating==='easy').length;const chart=[];for(let i=13;i>=0;i--){let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);let day=dateKey(d.getTime());let n=log.filter(l=>l.date===day).length;chart.push({day,n})}let topicMap={};for(let x of log){let c=state.cards.find(c=>c.id===x.cardId);let k=c?.topic||'Outro';if(!topicMap[k])topicMap[k]={total:0,good:0};topicMap[k].total++;if(['good','easy'].includes(x.rating))topicMap[k].good++}let sorted=Object.entries(topicMap).sort((a,b)=>b[1].total-a[1].total).slice(0,12),c=currentCounts();return `<div class="eyebrow">ACOMPANHE SEU PROGRESSO</div><h1 class="hero-title">Estatísticas</h1><p class="lede">Os resultados mostram frequência e autopercepção de lembrança. Não substituem os acertos objetivos dos simulados.</p><div class="stats-grid"><div class="stat"><div class="stat-top">Respostas ${icon('check')}</div><div class="stat-val">${num(log.length)}</div><div class="stat-foot">Em todas as sessões</div></div><div class="stat"><div class="stat-top">Bom ou fácil ${icon('target')}</div><div class="stat-val stat-accent">${log.length?Math.round(correct/log.length*100):0}%</div><div class="stat-foot">Das respostas avaliadas</div></div><div class="stat"><div class="stat-top">Já estudados ${icon('library')}</div><div class="stat-val">${c.learned}</div><div class="stat-foot">Cartões revistos ao menos uma vez</div></div><div class="stat"><div class="stat-top">Pendentes ${icon('clock')}</div><div class="stat-val stat-orange">${c.due}</div><div class="stat-foot">Com revisão vencida</div></div></div><div class="two-col"><div class="panel"><h3>Atividade dos últimos 14 dias</h3><p>Quanto mais intensa a cor, mais revisões registradas.</p><div class="heatmap">${chart.map(c=>`<div class="heatcell ${c.n>=30?'l4':c.n>=15?'l3':c.n>=5?'l2':c.n>0?'l1':''}" title="${safe(c.day)} · ${c.n} revisões" aria-label="${safe(c.day)}: ${c.n} revisões"></div>`).join('')}</div><div class="heat-labels"><span>14 dias atrás</span><span>Hoje</span></div><div class="sep"></div><h3>O que significa a taxa de acerto?</h3><p>É a proporção de cartões marcados como “Bom” ou “Fácil”. Como a avaliação é pessoal, use também os simulados para medir domínio real.</p></div><div class="panel"><h3>Por tópico</h3><p>Tópicos com mais respostas registradas. O percentual indica lembranças avaliadas como boas/fáceis.</p>${sorted.length?sorted.map(([name,o])=>`<div class="topic-row"><div class="topic-name">${safe(name)}</div><div class="topic-bar"><div class="progress"><div class="progress-fill" style="width:${Math.round(o.good/o.total*100)}%"></div></div></div><div class="topic-count">${Math.round(o.good/o.total*100)}% · ${o.total}</div></div>`).join(''):'<div class="empty">As estatísticas aparecem após suas primeiras revisões.</div>'}</div></div><div style="margin-top:18px;display:flex;gap:9px;flex-wrap:wrap"><button class="secondary" id="export-logs">${icon('download')} Exportar histórico CSV</button><button class="ghost" data-nav="home">Voltar para hoje</button></div>`}

function startStudy(deckId){const queue=listForSession(deckId).map(c=>c.id);if(!queue.length){toast('Nenhum cartão disponível para revisão neste momento.');setView('home');return}study={deckId,queue,index:0,completed:0,flipped:false};undo=null;view='study';window.scrollTo({top:0,behavior:'instant'});render()}
function flip(){if(!study||study.index>=study.queue.length)return;study.flipped=!study.flipped;render()}
function grade(rating){if(!study||!study.flipped)return;const c=state.cards.find(c=>c.id===study.queue[study.index]);if(!c)return;undo={card:JSON.parse(JSON.stringify(c)),logLen:state.logs.length,studyIndex:study.index,studyCompleted:study.completed};const wasNew=c.totalReviews===0,tm=tNow(),oldInt=c.interval||0;let interval=0,due;
if(rating==='again'){c.ease=Math.max(1.3,(c.ease||2.5)-.2);c.lapses=(c.lapses||0)+1;c.interval=0;due=tm+10*60*1000}
else if(rating==='hard'){c.ease=Math.max(1.3,(c.ease||2.5)-.15);interval=wasNew?1:Math.max(1,Math.ceil(oldInt*1.2));c.interval=interval;due=tm+interval*86400000}
else if(rating==='good'){interval=wasNew?1:oldInt<=1?3:Math.max(2,Math.round(oldInt*(c.ease||2.5)));c.interval=interval;due=tm+interval*86400000}
else if(rating==='easy'){c.ease=Math.min(3.3,(c.ease||2.5)+.15);interval=wasNew?4:Math.max(4,Math.round(Math.max(1,oldInt)*c.ease*1.3));c.interval=interval;due=tm+interval*86400000}else return;
c.dueAt=due;c.totalReviews++;c.reps=rating==='again'?0:c.reps+1;c.lastReviewed=tm;state.logs.push({id:uid(),cardId:c.id,date:dateKey(tm),timestamp:tm,rating,wasNew,topic:c.topic,deckId:c.deckId});study.index++;study.completed++;study.flipped=false;persist();render()}
function undoGrade(){if(!undo){toast('Nada para desfazer.');return}const ix=state.cards.findIndex(c=>c.id===undo.card.id);if(ix>=0)state.cards[ix]=undo.card;state.logs.splice(undo.logLen);study.index=undo.studyIndex;study.completed=undo.studyCompleted;study.flipped=true;undo=null;persist();render();toast('Última avaliação desfeita.')}

function saveCardFromForm(form){let id=form.dataset.cardId,front=document.getElementById('card-front').value.trim(),back=document.getElementById('card-back').value.trim(),deckId=document.getElementById('card-deck').value,topic=document.getElementById('card-topic').value.trim(),tags=document.getElementById('card-tags').value.trim();if(!front||!back){toast('Preencha pergunta e resposta.');return}let dupe=state.cards.some(c=>c.id!==id&&c.deckId===deckId&&norm(c.front)===norm(front));if(dupe){toast('Já existe uma pergunta igual nesse baralho.');return}if(id){let c=state.cards.find(c=>c.id===id);if(!c)return;Object.assign(c,{deckId,front,back,topic,tags})}else{state.cards.push({id:uid(),deckId,front,back,topic,tags,source:'Criado manualmente',createdAt:tNow(),dueAt:tNow(),interval:0,ease:2.5,reps:0,lapses:0,totalReviews:0,suspended:false,lastReviewed:null})}persist();closeModal();render();toast('Cartão salvo.')}
function normalizeCard(c){if(!c||typeof c!=='object')return null;let front=String(c.front??c.pergunta??c.question??'').trim();let back=String(c.back??c.resposta??c.response??'').trim();let options=c.options??c.alternativas;if(Array.isArray(options)&&options.length){front+='\n\n'+options.map((o,i)=>typeof o==='string'?`${'ABCDE'[i]||i+1}) ${o}`:JSON.stringify(o)).join('\n');if(!back){back='Resposta: '+String(c.answer??c.correct??c.gabarito??'')+(c.explanation?'\n\n'+String(c.explanation):'')}}if(!front||!back||front.length>12000||back.length>20000)return null;const tags=Array.isArray(c.tags)?c.tags.join(', '):String(c.tags??'');return {front,back,topic:String(c.topic??c.topico??c.assunto??'').slice(0,120),tags:tags.slice(0,250)}}
function parseDelimited(raw){const lines=raw.replace(/^\ufeff/,'').replace(/\r\n/g,'\n').split('\n').filter(x=>x.trim());if(!lines.length)return[];const delim=lines[0].includes('\t')?'\t':';';function parseRow(line){let out=[],cur='',quoted=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(ch===delim&&!quoted){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}let arr=lines.map(parseRow);let header=arr[0].map(norm);const hasHeader=header.some(x=>['front','pergunta','question'].includes(x))&&header.some(x=>['back','resposta','response'].includes(x));let get=(row,key,def)=>hasHeader?(row[header.findIndex(h=>key.includes(h))]||''):row[def]||'';return arr.slice(hasHeader?1:0).map(row=>({front:get(row,['front','pergunta','question'],0),back:get(row,['back','resposta','response'],1),topic:get(row,['topic','topico','assunto'],2),tags:get(row,['tags','etiquetas'],3)}))}
function parsePack(raw,defaultDeck){const text=raw.replace(/^\ufeff/,'').trim();if(!text)throw Error('Cole ou escolha um arquivo com questões.');let packs=[];if(text.startsWith('{')||text.startsWith('[')){let ob;try{ob=JSON.parse(text)}catch(e){throw Error('JSON inválido: '+e.message)}if(ob&&ob.version&&ob.logs&&ob.decks)throw Error('Este é um backup completo. Use Restaurar backup em Configurações.');if(Array.isArray(ob))packs=ob.length&&ob[0]?.cards?ob:[{deck:defaultDeck,cards:ob}];else if(Array.isArray(ob.packs))packs=ob.packs;else packs=[ob]}else{packs=[{deck:defaultDeck,cards:parseDelimited(text)}]}return packs.map(p=>({deck:p.deck||p.baralho||defaultDeck,cards:p.cards||p.cartoes||[]}))}
function importPack(raw,defaultDeckId){const fallback=deckOf(defaultDeckId);const packs=parsePack(raw,fallback?.name||'Importados');let added=0,dupes=0,bad=0,created=0;let existingByDeck=new Map();for(let c of state.cards){const k=c.deckId+'|'+norm(c.front);existingByDeck.set(k,1)}for(let p of packs){if(!Array.isArray(p.cards))throw Error('Campo cards deve ser uma lista.');if(p.cards.length>10000)throw Error('Máximo de 10 mil cartões por pacote.');let target=state.decks.find(d=>norm(d.name)===norm(p.deck))||state.decks.find(d=>d.id===p.deck);if(!target){target=newDeck(String(p.deck).slice(0,90),'Baralho importado');created++}for(let raw of p.cards){let x=normalizeCard(raw);if(!x){bad++;continue}let key=target.id+'|'+norm(x.front);if(existingByDeck.has(key)){dupes++;continue}existingByDeck.set(key,1);state.cards.push({id:uid(),deckId:target.id,...x,source:'Importado',createdAt:tNow(),dueAt:tNow(),interval:0,ease:2.5,reps:0,lapses:0,totalReviews:0,suspended:false,lastReviewed:null});added++}}persist();render();return{added,dupes,bad,created}}

async function copyText(s){try{await navigator.clipboard.writeText(s);toast('Copiado.')}catch(e){let tx=document.createElement('textarea');tx.value=s;document.body.append(tx);tx.select();try{document.execCommand('copy');toast('Copiado.')}catch(ex){toast('Selecione e copie o texto manualmente.')}tx.remove()}}
// Navigation and button commands
 document.addEventListener('click',async event=>{const tgt=event.target.closest('button,label');if(!tgt)return;const nav=tgt.closest('[data-nav]');if(nav){setView(nav.dataset.nav);return}const studyBtn=tgt.closest('[data-study]');if(studyBtn){startStudy(studyBtn.dataset.study);return}const filter=tgt.closest('[data-filter-deck]');if(filter){libraryDeck=filter.dataset.filterDeck;libraryPage=0;setView('library');return}const editing=tgt.closest('[data-edit]');if(editing){openCardModal(editing.dataset.edit);return}const susp=tgt.closest('[data-suspend]');if(susp){let c=state.cards.find(c=>c.id===susp.dataset.suspend);if(c){c.suspended=!c.suspended;persist();render();toast(c.suspended?'Cartão suspenso.':'Cartão reativado.')}return}const deleting=tgt.closest('[data-delete]');if(deleting){if(confirm('Excluir permanentemente este cartão?')){state.cards=state.cards.filter(c=>c.id!==deleting.dataset.delete);persist();render();toast('Cartão excluído.')}return}const rating=tgt.closest('[data-rate]');if(rating){grade(rating.dataset.rate);return}switch(tgt.id){case 'new-deck':openDeckModal();break;case 'new-card':openCardModal();break;case 'modal-close':closeModal();break;case 'flip-card':case 'reveal-btn':flip();break;case 'undo-btn':undoGrade();break;case 'page-prev':libraryPage=Math.max(0,libraryPage-1);render();break;case 'page-next':libraryPage++;render();break;case 'run-import':try{const d=document.getElementById('import-deck').value;const outcome=importPack(document.getElementById('import-text').value,d);document.getElementById('import-feedback').innerHTML=`<div class="notice"><strong>${outcome.added} novos cartões</strong> importados. ${outcome.dupes} duplicados ignorados, ${outcome.bad} inválidos, ${outcome.created} baralhos criados.</div>`;toast('Importação finalizada.')}catch(e){document.getElementById('import-feedback').innerHTML=`<div class="notice" style="border-color:var(--red)">${safe(e.message)}</div>`}break;case 'copy-prompt':copyText(promptText);break;case 'copy-example':copyText(JSON.stringify(exampleJSON,null,2));break;case 'save-settings':{let ni=+document.getElementById('setting-new').value,ri=+document.getElementById('setting-reviews').value,gi=+document.getElementById('setting-goal').value;if(!Number.isInteger(ni)||ni<0||ni>500||!Number.isInteger(ri)||ri<1||ri>5000||!Number.isInteger(gi)||gi<1||gi>1000){toast('Informe limites válidos.');return}Object.assign(state.settings,{newLimit:ni,reviewLimit:ri,dailyGoal:gi});persist();closeModal();render();toast('Preferências salvas.');break}case 'backup-export':backup();break;case 'reset-all':if(confirm('Apagar seus cartões, histórico e configurações? Esta ação não pode ser desfeita. Exporte backup antes.')){if(confirm('Confirma apagar TODOS os seus dados de estudo deste dispositivo?')){state=seeded();persist();closeModal();setView('home');toast('Baralhos iniciais restaurados.')}}break;case 'export-logs':exportLogs();break;default:break}});
 document.addEventListener('submit',ev=>{if(ev.target.id==='deck-form'){ev.preventDefault();const name=document.getElementById('deck-name').value.trim(),desc=document.getElementById('deck-description').value.trim();if(!name)return;if(state.decks.some(d=>norm(d.name)===norm(name))){toast('Já existe um baralho com esse nome.');return}newDeck(name,desc);closeModal();render();toast('Baralho criado.')}if(ev.target.id==='card-form'){ev.preventDefault();saveCardFromForm(ev.target)}});
 document.addEventListener('input',ev=>{if(ev.target.id==='library-search'){const pos=ev.target.selectionStart;libraryQuery=ev.target.value;libraryPage=0;render();const el=document.getElementById('library-search');el.focus();el.setSelectionRange(pos,pos)}});
 document.addEventListener('change',async ev=>{if(ev.target.id==='library-deck'){libraryDeck=ev.target.value;libraryPage=0;render()}if(ev.target.id==='import-file'){try{const txt=await fileText(ev.target);document.getElementById('import-text').value=txt||'';toast('Arquivo carregado. Confira e clique Importar cartões.')}catch(e){toast('Não foi possível ler o arquivo.')}}if(ev.target.id==='backup-file'){try{let text=await fileText(ev.target),obj=sanitizeState(JSON.parse(text));if(confirm(`Este backup contém ${obj.cards.length} cartões e substituirá todos os seus dados atuais. Continuar?`)){state=obj;await persist();closeModal();setView('home');toast('Backup restaurado com sucesso.')}}catch(e){toast('Falha ao restaurar: '+e.message)}}});
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&document.getElementById('modal-container').firstChild){closeModal();return}if(view!=='study'||!study||document.getElementById('modal-container').firstChild)return;const tag=(ev.target?.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag))return;if(ev.code==='Space'){ev.preventDefault();flip()}else if(study.flipped&&['1','2','3','4'].includes(ev.key)){ev.preventDefault();grade({1:'again',2:'hard',3:'good',4:'easy'}[ev.key])}});
 document.getElementById('modal-container').addEventListener('click',ev=>{if(ev.target.id==='modal-backdrop')closeModal()});
 async function checkForAppUpdate(){
  try{
    if('serviceWorker' in navigator){const registration=await navigator.serviceWorker.getRegistration();if(registration)await registration.update()}
    const result=await fetch('./version.json?v='+Date.now(),{cache:'no-store'});
    if(!result.ok)throw Error('Não foi possível verificar a versão publicada');
    const latest=await result.json();
    if(latest.version && latest.version!==APP_VERSION){
      if(confirm('A versão '+latest.version+' está publicada. Recarregar o aplicativo agora?'))location.reload();
      else toast('Uma nova versão está disponível. Reabra o aplicativo com internet.');
    }else toast('Você já está usando a versão mais recente ('+APP_VERSION+').');
  }catch(e){toast('Sem verificação no momento. Confira sua conexão e tente novamente.')}
 }
 document.addEventListener('click',event=>{if(event.target.closest('#app-update'))checkForAppUpdate()});
 if('serviceWorker'in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
 boot();
</script>
