<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1120"><title>Simulados semanais · Revisa TI</title>
<style>:root{color-scheme:dark;--bg:#0a1020;--p:#151f30;--p2:#1c293c;--line:#2f4056;--txt:#eff3fa;--muted:#abb9cd;--accent:#75e2ba;--warn:#edc283;--err:#ffa1a1}*{box-sizing:border-box}body{background:var(--bg);color:var(--txt);font:14px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif;margin:0}main{max-width:1040px;margin:auto;padding:20px 18px 85px}.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:25px}.brand{font-weight:850;letter-spacing:-.4px;color:var(--accent)}a{color:var(--accent)}h1{font-size:clamp(26px,5vw,40px);margin:5px 0 12px;line-height:1.2}h2{font-size:19px}h3{font-size:15px}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:850;color:var(--accent);text-transform:uppercase}.sub{color:var(--muted)}.card{background:var(--p);border:1px solid var(--line);border-radius:17px;padding:22px;margin:15px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border-radius:10px;border:1px solid var(--line);background:var(--p2);color:var(--txt);font-weight:700;padding:11px 15px;cursor:pointer;text-decoration:none;display:inline-block}.btn.primary{background:var(--accent);border-color:var(--accent);color:#092119}.btn:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:var(--p2);padding:14px;border-radius:12px}.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:12px}.choice{display:flex;align-items:flex-start;text-align:left;gap:12px;white-space:normal;width:100%;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;color:var(--txt);font:inherit;cursor:pointer}.choice strong{background:#32465f;display:grid;place-items:center;width:27px;height:27px;border-radius:7px;flex-shrink:0}.choice.selected{border-color:var(--accent);background:#16372f}.choice.correct{border-color:var(--accent)}.choice.incorrect{border-color:var(--err)}.qnav{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}.qbtn{border:1px solid var(--line);background:var(--p2);color:var(--txt);border-radius:8px;padding:9px 0;font-size:12px;cursor:pointer}.qbtn.done{border-color:var(--accent);color:var(--accent)}.qbtn.current{background:var(--accent);color:#05211a}.passage{padding:19px;background:#0b182a;border-left:4px solid var(--accent);border-radius:8px;white-space:pre-line;line-height:1.9;color:#dce7f4;margin:14px 0 23px}.bar{height:9px;border-radius:9px;background:#314157;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.review{border-top:1px solid var(--line);padding-top:14px;margin-top:18px}.tag{display:inline-block;border:1px solid var(--line);padding:3px 8px;border-radius:99px;color:var(--muted);font-size:11px}.wrong{color:var(--err)}.right{color:var(--accent)}textarea{width:100%;min-height:110px;resize:vertical;background:var(--p2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px}input[type=file]{max-width:100%}.small{font-size:12px}.notice{padding:13px;border:1px solid var(--line);border-radius:11px;background:#0f1a2c;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:16px}.qnav{grid-template-columns:repeat(5,1fr)}.choice{font-size:13px}.actions .btn{flex:1;text-align:center}.passage{font-size:13px;padding:14px}}</style></head><body><main><header class="head"><a class="brand" href="./index.html">REVISATI · IPREJUN</a><div class="actions"><a class="btn" href="./resgate.html">Backup diagnóstico</a><a class="btn" href="./provas.html">Provas VUNESP</a></div></header><div id="view">Carregando...</div></main>
<script>
'use strict';const KEY='revisati-weekly-v1';let packs={},attempts={},selected=null,current=0,view='home',error='';const $=id=>document.getElementById(id);const letters='ABCDE';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=t=>t?new Date(t).toLocaleString('pt-BR'):'—';
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');packs=s.packs||{};attempts=s.attempts||{}}catch(e){error='Armazenamento local inválido. Exporte um backup antes de limpar dados.'}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:1,packs,attempts}));return true}catch(e){alert('Falha ao salvar. Exporte o backup; verifique o espaço disponível.');return false}}
function validate(p){if(!p||p.schema!=='revisati-weekly-v1'||!p.id||!Array.isArray(p.questions)||p.questions.length!==50)throw Error('Pacote deve conter 50 questões no formato revisati-weekly-v1.');let counts={'Português':0,'Matemática':0,'Raciocínio Lógico':0,'Conhecimentos Específicos':0};for(let q of p.questions){if(!q.id||!Array.isArray(q.options)||q.options.length!==5||!letters.includes(q.answer)||!q.q||!(q.cat in counts)||!q.why)throw Error('Questão inválida: '+(q.id||'?'));counts[q.cat]++}if(Object.entries(counts).some(([k,v])=>v!==({'Português':10,'Matemática':10,'Raciocínio Lógico':5,'Conhecimentos Específicos':25}[k])))throw Error('Distribuição diferente do edital IPREJUN.');return p}
async function init(){load();try{const c=await fetch('./packs/catalogo.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Catálogo indisponível');return r.json()});for(let e of c.packs||[]){if(packs[e.id])continue;try{const p=validate(await fetch(e.path).then(r=>r.json()));packs[p.id]=p}catch(e){error='Alguns pacotes não carregaram. Abra o aplicativo com internet ou importe o JSON.'}}persist()}catch(e){error=error||'Sem acesso ao catálogo. Seus pacotes já importados permanecem disponíveis.'}render()}
function currentAttempt(id){return attempts[id]?.[attempts[id].length-1]||null}
function home(){let list=Object.values(packs).sort((a,b)=>String(a.edition).localeCompare(String(b.edition)));return `<div class="eyebrow">Treinamento contínuo · Independente dos diagnósticos</div><h1>Simulados semanais</h1><p class="sub">Novas provas autorais com 50 questões e cinco alternativas, inspiradas em características observadas nos cadernos da VUNESP. O conteúdo respeita a distribuição do edital IPREJUN, não o programa de outros cargos.</p><div class="grid"><div class="stat"><b>${list.length}</b><span>Simulados no acervo</span></div><div class="stat"><b>${Object.values(attempts).flat().filter(x=>x.finishedAt).length}</b><span>Tentativas concluídas</span></div><div class="stat"><b>${Object.keys(attempts).filter(k=>attempts[k]?.some(a=>a.finishedAt)).length}</b><span>Semanas avaliadas</span></div></div>${error?`<p class="notice">${esc(error)}</p>`:''}<div class="notice" style="margin-top:17px">Se você já concluiu dois diagnósticos, eles continuam em <a href="./simulados.html">Simulados diagnósticos</a>. O histórico semanal usa uma chave diferente e não altera esses resultados.</div>${list.map(p=>{const a=currentAttempt(p.id);const n=attempts[p.id]?.length||0;return `<div class="card"><div class="row"><span class="tag">${esc(p.edition||'Sem data')} · ${p.questions.length} questões</span><span class="tag">Tentativas: ${n}</span></div><h2>${esc(p.title)}</h2><p class="sub">${esc(p.description||'')} · 3h · 10 Português / 10 Matemática / 5 Lógica / 25 TI</p><div class="actions"><button class="btn primary" onclick="start('${esc(p.id)}')">${!a?'Iniciar simulado':a.finishedAt?'Ver última correção':'Continuar simulado'}</button>${a?.finishedAt?`<button class="btn" onclick="fresh('${esc(p.id)}')">Nova tentativa</button>`:''}</div></div>`}).join('')}<div class="card"><h2>Adicionar pacote semanal</h2><p class="sub">Importe novos arquivos JSON sem substituir o aplicativo ou os simulados anteriores.</p><input id="packfile" type="file" accept=".json,application/json"><button class="btn" onclick="importPack()">Importar novo simulado</button><div class="actions" style="margin-top:14px"><button class="btn" onclick="exportState()">Backup de todos os simulados semanais</button><label class="btn" for="restorefile">Restaurar backup semanal</label><input style="display:none" id="restorefile" type="file" accept=".json,application/json" onchange="restoreState(event)"></div></div>`}
function start(id){const p=packs[id];if(!p)return;selected=id;const a=currentAttempt(id);if(!a)attempts[id]=[{id:'try-'+Date.now(),startedAt:Date.now(),finishedAt:null,answers:{},flags:{},notes:{}}];persist();const s=currentAttempt(id);current=p.questions.findIndex((q,i)=>s.answers[i]===undefined);if(current<0)current=0;view=s.finishedAt?'result':'exam';render()}
function fresh(id){if(!confirm('Iniciar outra tentativa? Todas as tentativas anteriores continuarão salvas.'))return;selected=id;(attempts[id]??=[]).push({id:'try-'+Date.now(),startedAt:Date.now(),finishedAt:null,answers:{},flags:{},notes:{}});persist();current=0;view='exam';render()}
function answer(v){const s=currentAttempt(selected);if(s?.finishedAt)return;s.answers[current]=v;persist();render()}
function flag(){const s=currentAttempt(selected);if(s?.finishedAt)return;s.flags[current]=!s.flags[current];persist();render()}
function jump(n){current=n;render()}
function finish(){const s=currentAttempt(selected),p=packs[selected];const miss=50-Object.keys(s.answers).length;if(!confirm(`Finalizar este simulado? ${miss} questão(ões) sem resposta. O gabarito será liberado.`))return;s.finishedAt=Date.now();persist();view='result';render()}
function metrics(p,s){let cats={},topics={},wrong=[],hits=0;for(let i=0;i<p.questions.length;i++){let q=p.questions[i],ok=s.answers[i]===q.answer;if(ok)hits++;else wrong.push(i);for(let [acc,k] of [[cats,q.cat],[topics,q.topic]]){acc[k]??={correct:0,total:0};acc[k].total++;if(ok)acc[k].correct++}}return {hits,cats,topics,wrong,pct:Math.round(hits/50*100)}}
function exam(){const p=packs[selected],s=currentAttempt(selected);if(!s||!p)return home();if(s.finishedAt){view='result';return result()}const q=p.questions[current],filled=Object.keys(s.answers).length,remaining=Math.max(0,(p.durationMinutes||180)*60000-(Date.now()-s.startedAt));if(remaining===0){s.finishedAt=Date.now();s.timedOut=true;persist();view='result';return result()};let x=q.passage&&p.passages?.[q.passage];return `<div class="row"><div><div class="eyebrow">${esc(p.title)} · ${esc(q.cat)}</div><h1>Questão ${current+1} / 50</h1><span class="sub">${esc(q.topic)} · ${filled} respondidas · ${Math.round(filled*2)}%</span></div><span class="tag" id="timer">${fmt(remaining)}</span></div><div class="bar" style="margin:17px 0"><i style="width:${filled*2}%"></i></div><div class="card">${x?`<div class="eyebrow">Texto para leitura</div><div class="passage">${esc(x)}</div>`:''}<h2>${esc(q.q)}</h2>${q.options.map((o,i)=>`<button class="choice ${s.answers[current]===letters[i]?'selected':''}" onclick="answer('${letters[i]}')"><strong>${letters[i]}</strong><span>${esc(o)}</span></button>`).join('')}<div class="actions" style="margin-top:16px"><button class="btn" onclick="jump(Math.max(0,current-1))">Anterior</button><button class="btn" onclick="flag()">${s.flags[current]?'Remover marcação':'Marcar dúvida'}</button><button class="btn primary" onclick="jump(Math.min(49,current+1))">Próxima</button></div></div><div class="card"><div class="row"><h3>Navegação</h3><button class="btn" onclick="finish()">Finalizar e corrigir</button></div><div class="qnav">${p.questions.map((q,i)=>`<button class="qbtn ${i===current?'current':''} ${s.answers[i]?'done':''}" onclick="jump(${i})">${i+1}${s.flags[i]?'*':''}</button>`).join('')}</div></div>`}
function fmt(ms){let sec=Math.ceil(ms/1000);return `${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function result(){const p=packs[selected],s=currentAttempt(selected);if(!s?.finishedAt){view='exam';return exam()}const m=metrics(p,s);let n=attempts[selected].length,rows=Object.entries(m.cats).map(([cat,z])=>`<div class="row" style="margin:13px 0"><b>${esc(cat)}</b><span>${z.correct}/${z.total} · ${Math.round(100*z.correct/z.total)}%</span></div><div class="bar"><i style="width:${100*z.correct/z.total}%"></i></div>`).join('');return `<div class="eyebrow">Resultado · ${esc(p.title)} · Tentativa ${n}</div><h1>${m.hits}/50 acertos (${m.pct}%)</h1><p class="sub">Iniciado em ${dt(s.startedAt)} · Concluído em ${dt(s.finishedAt)}. Meta de treino ≥43 acertos, não equivale à nota de corte oficial.</p><div class="grid"><div class="stat"><b>${m.hits}</b><span>Acertos</span></div><div class="stat"><b>${m.wrong.length}</b><span>Erros e omissões</span></div><div class="stat"><b>${fmt(s.finishedAt-s.startedAt)}</b><span>Tempo de prova</span></div></div><div class="card"><h2>Disciplinas</h2>${rows}</div><div class="card"><div class="row"><h2>Caderno de erros e distratores</h2><button class="btn" onclick="exportErrors()">Exportar flashcards dos erros</button></div><p class="sub">Analise a alternativa escolhida, a correta e a justificativa antes de refazer a questão.</p>${m.wrong.map(i=>{let q=p.questions[i],sel=s.answers[i]||'Não respondida',corr=q.answer;return `<div class="review"><div class="eyebrow">Questão ${i+1} · ${esc(q.cat)} / ${esc(q.topic)}</div><h3>${esc(q.q)}</h3><p class="small wrong">Sua marcação: ${esc(sel)}${sel!=='Não respondida'?' — '+esc(q.options[letters.indexOf(sel)]):''}</p><p class="small right">Correta: ${corr} — ${esc(q.options[letters.indexOf(corr)])}</p><p>${esc(q.why)}</p>${sel!=='Não respondida'&&q.distractors?.[sel]?`<div class="notice">Por que a alternativa ${sel} é um distrator: ${esc(q.distractors[sel])}</div>`:''}<textarea placeholder="Por que errei? Escreva com suas palavras." oninput="note(${i},this.value)">${esc(s.notes?.[i]||'')}</textarea></div>`}).join('')||'<p>Sem erros neste simulado.</p>'}</div><div class="actions"><button class="btn" onclick="view='home';render()">Voltar ao acervo</button><button class="btn" onclick="fresh('${esc(p.id)}')">Refazer prova</button><button class="btn" onclick="exportState()">Backup semanal</button></div>`}
function note(i,v){const s=currentAttempt(selected);s.notes[i]=v;persist()}
function download(name,data){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2400)}
function exportState(){download('revisati-semanais-backup-'+new Date().toISOString().slice(0,10)+'.json',{app:'revisati-weekly',version:1,exportedAt:new Date().toISOString(),packs,attempts})}
function exportErrors(){const p=packs[selected],s=currentAttempt(selected);if(!s?.finishedAt)return;const m=metrics(p,s);const cards=m.wrong.map(i=>{const q=p.questions[i];return {front:(p.passages?.[q.passage]?'Leia o texto: '+p.passages[q.passage]+'\n\n':'')+q.q+'\n'+q.options.map((x,n)=>letters[n]+') '+x).join('\n'),back:q.answer+') '+q.options[letters.indexOf(q.answer)]+'\n\n'+q.why,topic:q.topic,tags:'revisati, semanal, '+p.id}});download('revisati-flashcards-erros-'+p.id+'.json',{deck:'Erros - '+p.title,cards});alert('Pacote preparado. Importe o JSON na aba Importar do Revisa TI.')}
async function importPack(){let file=$('packfile').files?.[0];if(!file)return alert('Selecione um pacote JSON.');try{const p=validate(JSON.parse(await file.text()));if(packs[p.id])return alert('Esse pacote já existe. Seus resultados foram preservados.');packs[p.id]=p;persist();render();alert('Pacote importado com sucesso.')}catch(e){alert('Não foi possível importar: '+e.message)}}
async function restoreState(e){const file=e.target.files?.[0];if(!file)return;try{const b=JSON.parse(await file.text());if(!b.packs||!b.attempts||typeof b.packs!=='object'||typeof b.attempts!=='object')throw Error('Backup inválido');for(let p of Object.values(b.packs))validate(p);if(!confirm('Restaurar o histórico semanal do backup? Seu estado atual será baixado antes da substituição.'))return;exportState();if(!confirm('Confirme novamente para restaurar. Seus três diagnósticos e seus flashcards NÃO serão alterados.'))return;packs=b.packs;attempts=b.attempts;persist();view='home';render()}catch(err){alert('Restauração não efetuada: '+err.message)}finally{e.target.value=''}}
function render(){$('view').innerHTML=view==='home'?home():view==='exam'?exam():result();window.scrollTo(0,0)}setInterval(()=>{if(view==='exam'&&selected){const s=currentAttempt(selected),p=packs[selected];if(s&&!s.finishedAt){const rem=(p.durationMinutes||180)*60000-(Date.now()-s.startedAt);if(rem<=0){s.finishedAt=Date.now();s.timedOut=true;persist();view='result';render()}else{let t=$('timer');if(t)t.textContent=fmt(rem)}}}},1000);init();
</script></body></html>
