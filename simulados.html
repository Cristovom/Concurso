<style>
:root{--bg:#081120;--sidebar:#0c1828;--surface:#102035;--surface2:#172940;--edge:#2a3e56;--text:#e9f1fa;--sub:#9eb1c7;--cyan:#59c5d6;--green:#72d9ac;--yellow:#f0c783;--red:#ee8989;--radius:16px;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.5}button,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}a{color:var(--cyan)}
.shell{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}.side{padding:28px 18px;background:var(--sidebar);border-right:1px solid var(--edge);position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:850;letter-spacing:-.7px}.brand span{color:var(--cyan)}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.9px;color:var(--sub);font-weight:800;margin-bottom:6px}.sub{color:var(--sub);font-size:14px}.side .sub{margin-top:12px;margin-bottom:35px}.nav{display:grid;gap:8px}.navbtn{width:100%;padding:12px 14px;background:transparent;color:var(--sub);border:1px solid transparent;border-radius:10px;text-align:left}.navbtn.active,.navbtn:hover{background:#173046;color:var(--text);border-color:#254a62}.main{max-width:1120px;width:100%;padding:40px 5vw;margin:0 auto}.heading{font-size:clamp(26px,4vw,40px);letter-spacing:-1.3px;line-height:1.15;margin:8px 0 12px}.lead{font-size:15px;color:var(--sub);max-width:780px;margin:0 0 26px}.panel{background:var(--surface);border:1px solid var(--edge);border-radius:var(--radius);padding:24px}.panel + .panel{margin-top:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.tiny{font-size:12px;color:var(--sub)}.card h3{font-size:22px;margin:8px 0 12px}.pill{display:inline-block;font-size:11px;letter-spacing:.4px;padding:5px 10px;border:1px solid #375267;border-radius:99px;color:#a5dae5;background:#163044}.stat{font-size:34px;font-weight:850;letter-spacing:-1px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{padding:10px 15px;border-radius:10px;border:1px solid var(--edge);background:var(--surface2);color:var(--text);font-weight:700}.btn:hover{border-color:#6393ae}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#092136}.btn.danger{background:transparent;border-color:#ab6875;color:#fab0b8}.btn.small{padding:6px 10px;font-size:12px}.muted{color:var(--sub)}.separator{height:1px;background:var(--edge);margin:20px 0}.measure{height:9px;background:#22384d;border-radius:20px;overflow:hidden}.measure i{display:block;background:var(--cyan);height:100%;border-radius:inherit}.q-head{margin-top:10px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between}.q-title{font-size:clamp(18px,2.5vw,26px);line-height:1.4;margin:8px 0 22px}.options{display:grid;gap:10px}.opt{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid #2d4259;background:#0e1b2e;border-radius:11px;cursor:pointer;transition:.15s}.opt:hover{border-color:#5d859e;background:#162a3f}.opt.selected{border-color:var(--cyan);box-shadow:0 0 0 1px #59c5d633;background:#173348}.opt .letter{display:inline-flex;width:27px;height:27px;border:1px solid #5c7187;border-radius:7px;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}.pager{display:flex;flex-wrap:wrap;gap:7px}.number{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid #36495e;background:#14263b;color:var(--sub);border-radius:7px}.number.done{background:#254b56;border-color:#367b86;color:#c4e7ed}.number.current{outline:2px solid var(--cyan);color:#fff}.number.doubt{border-color:var(--yellow);color:var(--yellow)}.info{background:#122a36;border:1px solid #315b64;border-radius:12px;padding:12px 15px;color:#bddce4}.warn{background:#35281e;border:1px solid #7b613e;color:#f5d59b}.empty{margin:0;padding:30px 0;color:var(--sub)}.mini-row{display:grid;grid-template-columns:1fr 90px;gap:15px;align-items:center;border-bottom:1px solid var(--edge);padding:11px 0}.mini-row:last-child{border:0}.bad{color:var(--red)}.good{color:var(--green)}.yellow{color:var(--yellow)}.review{padding:15px 0;border-top:1px solid var(--edge)}.review p{margin:8px 0}.review .why{color:#bed3e2}.label{display:block;margin-bottom:8px;font-weight:750}textarea{width:100%;min-height:200px;resize:vertical;border-radius:12px;border:1px solid #426079;background:#081628;color:var(--text);padding:14px;line-height:1.5}textarea:focus{outline:2px solid var(--cyan)}.check{display:flex;align-items:center;gap:8px;margin:18px 0;color:var(--sub)}.foot{font-size:12px;color:#8195ab;margin-top:34px}.status{padding:5px 9px;border-radius:6px;background:#1b3850;color:var(--cyan);font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formula{padding:15px 18px;border-left:3px solid var(--cyan);background:#14293c;border-radius:6px;margin:15px 0;color:#c5dbe9}.hide{display:none}
@media(max-width:900px){.shell{display:block}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--edge);padding:16px}.side .sub{margin:0 0 13px}.nav{display:flex;overflow:auto}.navbtn{white-space:nowrap}.main{padding:22px 15px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.panel{padding:18px}}
@media print{.side{display:none}.shell{display:block}.main{max-width:100%}.btn{display:none}.panel{break-inside:avoid}}

.back-app{position:fixed;right:16px;top:12px;z-index:99;background:#173046;border:1px solid #3c5f78;color:#effaff;border-radius:10px;padding:9px 13px;text-decoration:none;font:650 12px system-ui;box-shadow:0 5px 20px #07101bcc}
@media(max-width:800px){.back-app{top:auto;bottom:16px;right:16px}}

<script type="application/json" id="bank">[[{"cat":"Português","topic":"Concordância","q":"Assinale a alternativa em que a concordância verbal está correta.","options":["Houveram diversos chamados ontem.","Existem diferentes formas de autenticação.","Aconteceu problemas na rede.","Fazem três anos que o servidor ingressou.","É necessário as atualizações."],"answer":1,"why":"Existir concorda com seu sujeito plural: diferentes formas.","id":"S1-01"},{"cat":"Português","topic":"Crase","q":"Assinale a frase em que o acento indicativo de crase está corretamente empregado.","options":["Enviei os arquivos à um colega.","Começamos à configurar o sistema.","O técnico respondeu à todos.","Encaminhei o relatório à diretoria.","O servidor ficou à funcionar."],"answer":3,"why":"Há preposição a e artigo feminino a antes de diretoria.","id":"S1-02"},{"cat":"Português","topic":"Pontuação","q":"Em qual alternativa a vírgula isola corretamente um vocativo?","options":["Servidor, revise a configuração antes de sair.","Servidor revise a configuração, antes de sair.","Servidor revise a, configuração antes de sair.","Servidor revise, a configuração antes de sair.","Servidor revise a configuração antes, de sair."],"answer":0,"why":"O termo Servidor é um chamamento (vocativo) e deve ser separado por vírgula.","id":"S1-03"},{"cat":"Português","topic":"Regência","q":"Assinale a alternativa que respeita a regência tradicional do verbo assistir no sentido de ver.","options":["Assisti no treinamento ontem.","Assisti pelo treinamento ontem.","Assisti ao treinamento ontem.","Assisti para o treinamento ontem.","Assisti o treinamento ontem."],"answer":2,"why":"No sentido de presenciar, assistir é transitivo indireto e exige preposição a.","id":"S1-04"},{"cat":"Português","topic":"Pronome","q":"Na frase “O técnico entregou-lhe as credenciais”, o pronome “lhe” funciona como","options":["objeto indireto.","predicativo do sujeito.","objeto direto.","adjunto adverbial.","sujeito da oração."],"answer":0,"why":"Lhe equivale a a ele/a ela: destinatário da entrega.","id":"S1-05"},{"cat":"Português","topic":"Interpretação","q":"Considere: “A atualização será aplicada somente após a validação dos backups.” O que é possível concluir?","options":["A atualização não depende de qualquer condição.","A atualização já foi aplicada.","A validação ocorrerá depois da atualização.","A validação dos backups é condição anterior à atualização.","Os backups serão dispensados."],"answer":3,"why":"Somente após expressa condição temporal anterior.","id":"S1-06"},{"cat":"Português","topic":"Concordância","q":"Assinale a alternativa correta quanto à concordância nominal.","options":["As cópias seguem anexo.","Os arquivos está disponíveis.","É proibido a entrada de visitantes.","Os relatórios seguem anexos.","As informações seguem anexo."],"answer":3,"why":"Anexos concorda com o substantivo relatórios.","id":"S1-07"},{"cat":"Português","topic":"Crase","q":"Qual frase NÃO admite crase por ter verbo depois da preposição?","options":["A mensagem chegou à unidade.","A servidora dirigiu-se à chefia.","O relatório foi enviado à gestora.","A equipe voltou à sala.","A equipe começou a testar os servidores."],"answer":4,"why":"Não ocorre artigo feminino diante de verbo no infinitivo.","id":"S1-08"},{"cat":"Português","topic":"Pontuação","q":"A pontuação está correta em:","options":["Depois do teste a equipe, documentou os resultados.","Depois, do teste a equipe documentou os resultados.","Depois do teste, a equipe documentou os resultados.","Depois do teste, a equipe, documentou os resultados.","Depois do teste a equipe documentou, os resultados."],"answer":2,"why":"A oração adverbial temporal anteposta pode ser separada por vírgula.","id":"S1-09"},{"cat":"Português","topic":"Classe de palavras","q":"Na expressão “procedimento extremamente seguro”, a palavra “extremamente” é","options":["preposição.","pronome.","advérbio.","substantivo.","conjunção."],"answer":2,"why":"Modifica o adjetivo seguro, indicando intensidade.","id":"S1-10"},{"cat":"Matemática","topic":"Porcentagem","q":"Um equipamento de R$ 240,00 teve desconto de 15%. Qual o valor do desconto?","options":["R$ 204,00","R$ 36,00","R$ 46,00","R$ 15,00","R$ 26,00"],"answer":1,"why":"Desconto = preço × percentual / 100.","id":"S1-11"},{"cat":"Matemática","topic":"Proporção","q":"Se 4 servidores processam 16 registros por minuto em iguais condições, quantos registros processam 6 servidores?","options":["24","22","16","32","25"],"answer":0,"why":"Grandezas diretamente proporcionais: n × b / a.","id":"S1-12"},{"cat":"Matemática","topic":"Equações","q":"Resolva: 3x + 7 = 31. Qual é x?","options":["11","7","8","9","24"],"answer":2,"why":"Isolando x: (termo independente retirado) dividido pelo coeficiente.","id":"S1-13"},{"cat":"Matemática","topic":"Média","q":"Qual é a média aritmética de 6, 8, 10, 12?","options":["12","9","10","36","8"],"answer":1,"why":"Some os valores e divida pelo total de observações.","id":"S1-14"},{"cat":"Matemática","topic":"Geometria","q":"Um retângulo mede 12 m por 5 m. Qual é sua área?","options":["72 m²","60 m²","34 m²","120 m²","17 m²"],"answer":1,"why":"Área do retângulo é base × altura.","id":"S1-15"},{"cat":"Matemática","topic":"MDC","q":"Qual é o maior divisor comum de 18 e 24?","options":["42","18","24","12","6"],"answer":4,"why":"MDC é o maior inteiro que divide ambos exatamente.","id":"S1-16"},{"cat":"Matemática","topic":"MMC","q":"Dois processos executam a cada 4 e 6 minutos. Após quantos minutos mínimos se repetem juntos?","options":["12","16","6","24","10"],"answer":0,"why":"O encontro ocorre no mínimo múltiplo comum.","id":"S1-17"},{"cat":"Matemática","topic":"Pitágoras","q":"Um triângulo retângulo tem catetos de 3 cm e 4 cm. A hipotenusa mede","options":["7 cm","6 cm","5 cm","4 cm","12 cm"],"answer":2,"why":"Hipotenusa ao quadrado = soma dos quadrados dos catetos.","id":"S1-18"},{"cat":"Matemática","topic":"Divisão","q":"Uma equipe organiza 540 arquivos em 3 lotes iguais. Cada lote terá","options":["190 arquivos","170 arquivos","1620 arquivos","537 arquivos","180 arquivos"],"answer":4,"why":"Divida a quantidade total pelo número de lotes.","id":"S1-19"},{"cat":"Matemática","topic":"Expressões","q":"Calcule 2 × (30 − 12).","options":["38","36","18","48","34"],"answer":1,"why":"Primeiro resolva os parênteses; depois multiplique por 2.","id":"S1-20"},{"cat":"Raciocínio Lógico","topic":"Condicional","q":"A proposição “Se a rede caiu, então o alerta foi emitido” é falsa somente quando","options":["a rede não caiu e o alerta foi emitido.","a rede não caiu e o alerta não foi emitido.","a rede caiu e o alerta foi emitido.","o alerta foi emitido, independentemente da rede.","a rede caiu e o alerta não foi emitido."],"answer":4,"why":"P → Q só é falsa quando P é verdadeira e Q falsa.","id":"S1-21"},{"cat":"Raciocínio Lógico","topic":"Negação","q":"A negação de “Todos os servidores estão ativos” é","options":["Existe ao menos um servidor que não está ativo.","Nenhum servidor está ativo.","Existe exatamente um servidor ativo.","Alguns servidores estão ativos.","Todos os servidores estão inativos."],"answer":0,"why":"Negação de universal afirmativa = existência de contraexemplo.","id":"S1-22"},{"cat":"Raciocínio Lógico","topic":"Sequências","q":"Qual número completa a sequência 2, 5, 11, 23, 47, ...?","options":["71","89","96","95","84"],"answer":3,"why":"A regra é multiplicar por 2 e adicionar 1.","id":"S1-23"},{"cat":"Raciocínio Lógico","topic":"Equivalência","q":"A negação de “A senha está correta E o usuário está ativo” é equivalente a","options":["A senha está correta OU o usuário está ativo.","A senha não está correta E o usuário não está ativo.","A senha está correta E o usuário não está ativo.","A senha está correta se e somente se o usuário está ativo.","A senha não está correta OU o usuário não está ativo."],"answer":4,"why":"Lei de De Morgan: ¬(P∧Q)=¬P∨¬Q.","id":"S1-24"},{"cat":"Raciocínio Lógico","topic":"Argumentação","q":"Todo administrador é servidor. Ana é administradora. Logo,","options":["nenhum servidor é administrador.","todo servidor é administrador.","Ana não é servidora.","Ana é servidora.","Ana pode não ser servidora."],"answer":3,"why":"Instanciação de regra universal e modus ponens.","id":"S1-25"},{"cat":"Conhecimentos Específicos","topic":"Redes","q":"No modelo OSI, o encaminhamento de pacotes IP entre redes é função primordial da camada","options":["física.","enlace.","aplicação.","sessão.","rede."],"answer":4,"why":"A camada 3 (rede) realiza endereçamento e roteamento IP.","id":"S1-26"},{"cat":"Conhecimentos Específicos","topic":"Redes","q":"Uma VLAN em switches gerenciáveis é usada principalmente para","options":["atribuir endereços IPv6 obrigatoriamente.","aumentar o tamanho do cabo Ethernet.","segmentar logicamente domínios de broadcast.","criptografar discos locais.","substituir o DNS."],"answer":2,"why":"VLANs separam domínios de broadcast em nível 2.","id":"S1-27"},{"cat":"Conhecimentos Específicos","topic":"Redes","q":"Em uma rede IPv4 /24 típica, a máscara de sub-rede é","options":["255.0.0.0","255.255.255.240","255.255.255.0","255.255.0.0","255.255.255.252"],"answer":2,"why":"/24 indica 24 bits de rede: 255.255.255.0.","id":"S1-28"},{"cat":"Conhecimentos Específicos","topic":"Protocolos","q":"Qual serviço normalmente atribui automaticamente endereço IP e parâmetros de rede aos clientes?","options":["DNS","FTP","SMTP","SNMP","DHCP"],"answer":4,"why":"DHCP distribui configuração de rede automaticamente.","id":"S1-29"},{"cat":"Conhecimentos Específicos","topic":"Protocolos","q":"Qual protocolo é usado para acesso remoto a um shell criptografado?","options":["NFS","Telnet","SSH","TFTP","POP3"],"answer":2,"why":"SSH oferece acesso remoto protegido por criptografia.","id":"S1-30"},{"cat":"Conhecimentos Específicos","topic":"Linux","q":"Em sistemas Debian, o gerenciador usual de pacotes da linha de comando é","options":["dism","gpedit","regedit","apt","ipconfig"],"answer":3,"why":"APT instala e gerencia pacotes em distribuições Debian.","id":"S1-31"},{"cat":"Conhecimentos Específicos","topic":"Linux","q":"Qual comando Linux verifica o estado de um serviço administrado pelo systemd?","options":["fdisk --check-service","chmod service","lsusb --restart","pwd --status","systemctl status"],"answer":4,"why":"systemctl status nome-serviço informa o estado de unidades systemd.","id":"S1-32"},{"cat":"Conhecimentos Específicos","topic":"Windows e AD","q":"No Active Directory, uma GPO permite","options":["realizar somente backup incremental.","criar VLANs no switch de acesso.","executar exclusivamente consultas SQL.","substituir o endereço IP por um nome DNS.","definir políticas centralizadas para usuários e computadores."],"answer":4,"why":"GPOs distribuem configurações de usuário e computador no domínio.","id":"S1-33"},{"cat":"Conhecimentos Específicos","topic":"Windows e AD","q":"No Windows Server, o serviço AD DS está associado ao","options":["editor de planilhas.","controle de dispositivos Bluetooth.","gerenciamento de domínios e identidades.","roteamento exclusivamente BGP.","registro de imagens ISO."],"answer":2,"why":"Active Directory Domain Services organiza identidades, objetos e autenticação no domínio.","id":"S1-34"},{"cat":"Conhecimentos Específicos","topic":"Windows e AD","q":"Qual comando do Windows é frequentemente usado para atualizar políticas de grupo no cliente?","options":["route add gpo","apt upgrade","gpupdate /force","netstat /gpo","dism /delete-gpo"],"answer":2,"why":"gpupdate /force solicita reaplicação das políticas de grupo.","id":"S1-35"},{"cat":"Conhecimentos Específicos","topic":"Segurança","q":"O objetivo principal de um IDS é","options":["bloquear automaticamente todo tráfego.","distribuir endereços DHCP.","substituir o switch.","criar usuários no domínio.","detectar e alertar sobre atividades suspeitas."],"answer":4,"why":"IDS detecta intrusões; IPS normalmente adiciona capacidade de prevenção.","id":"S1-36"},{ "Bloco de Notas exclusivamente","Gerenciador de Tarefas exclusivamente","Windows Media Player","Microsoft Paint"],"answer":0,"why":"A GPMC é usada para criação, vinculação e administração de GPOs.","id":"S3-35"},{"cat":"Conhecimentos Específicos","topic":"Segurança","q":"O objetivo primário da autenticação multifator é","options":["fazer cópias dos arquivos em múltiplas pastas.","exigir fatores de categorias distintas para reduzir risco de acesso indevido.","atribuir múltiplos endereços IP à placa.","substituir toda criptografia TLS.","impedir todo e qualquer incidente de segurança."],"answer":1,"why":"MFA combina fatores como conhecimento, posse e inerência.","id":"S3-36"},{"cat":"Conhecimentos Específicos","topic":"Segurança","q":"No ataque de ransomware, é comum que o criminoso","options":["criptografe dados da vítima para extorquir pagamento.","realize apenas atualização normal do sistema.","crie índices SQL para otimizar consultas.","publique registros DNS de testes.","reduza a latência da rede."],"answer":0,"why":"Ransomware usa bloqueio/criptografia e coerção; outras extorsões também existem.","id":"S3-37"},{"cat":"Conhecimentos Específicos","topic":"Segurança","q":"O conceito de menor privilégio recomenda","options":["desabilitar os logs de acesso.","tornar todos os usuários administradores.","usar uma senha coletiva em todos os sistemas.","conceder somente permissões necessárias à função.","permitir acesso irrestrito a pastas compartilhadas."],"answer":3,"why":"Least privilege reduz escopo de permissões e risco.","id":"S3-38"},{"cat":"Conhecimentos Específicos","topic":"Virtualização","q":"Em um host Hyper-V, um checkpoint é utilizado para","options":["garantir substituição de backups permanentes.","montar a estrutura de cabos de rede.","configurar DHCP em switches físicos.","criptografar DNS por padrão.","registrar o estado de uma VM para possível retorno."],"answer":4,"why":"Checkpoint preserva estado da VM, mas não substitui política de backup.","id":"S3-39"},{"cat":"Conhecimentos Específicos","topic":"Monitoramento","q":"Se o objetivo é acompanhar disponibilidade e receber alertas quando um servidor parar de responder, uma ferramenta adequada é","options":["Bloco de Notas","LibreOffice Writer","Windows Calculator","GIMP","Nagios"],"answer":4,"why":"Nagios permite verificações de disponibilidade e notificações.","id":"S3-40"},{"cat":"Conhecimentos Específicos","topic":"Banco de dados","q":"Qual comando SQL reverte as alterações de uma transação ainda não confirmada?","options":["INSERT","ROLLBACK","COMMIT","GRANT","CREATE INDEX"],"answer":1,"why":"ROLLBACK desfaz transações pendentes de confirmação.","id":"S3-41"},{"cat":"Conhecimentos Específicos","topic":"Banco de dados","q":"Em SQL, um índice costuma ser criado para","options":["impedir todas as operações de atualização.","duplicar todos os dados sem custo.","substituir a integridade referencial.","alterar o protocolo de rede da aplicação.","acelerar certos tipos de busca, com custo de armazenamento e manutenção."],"answer":4,"why":"Índices favorecem busca/ordenação, mas são mantidos em gravações.","id":"S3-42"},{"cat":"Conhecimentos Específicos","topic":"Programação","q":"Uma função que recebe parâmetros e retorna um valor exemplifica","options":["obrigatoriamente um túnel VPN.","um certificado X.509.","abstração e reutilização de código.","um endereço IPv4 multicast.","o formato de um switch VLAN."],"answer":2,"why":"Funções encapsulam comportamento que pode ser reutilizado.","id":"S3-43"},{"cat":"Conhecimentos Específicos","topic":"Redes","q":"Um roteador recebe pacote de uma rede para outra; em regra, a informação decisiva para selecionar a rota é","options":["nome do arquivo no disco.","tamanho da fonte do navegador.","senha do usuário Windows.","endereço IP de destino.","modelo do teclado."],"answer":3,"why":"Roteamento IP utiliza prefixos e endereço de destino para escolher próximo salto.","id":"S3-44"},{"cat":"Conhecimentos Específicos","topic":"Protocolos","q":"Em administração remota do Windows, o RDP normalmente utiliza a porta","options":["5432","53","22","25","3389"],"answer":4,"why":"Remote Desktop Protocol usa tipicamente TCP/UDP 3389.","id":"S3-45"},{"cat":"Conhecimentos Específicos","topic":"Windows e AD","q":"Em uma rede Windows, o RRAS é associado principalmente a","options":["consulta SQL via JDBC.","geração de certificados WebPKI.","desenvolvimento de macros do Excel.","roteamento e acesso remoto.","reparo de arquivos de imagem pelo DISM."],"answer":3,"why":"RRAS é Routing and Remote Access Service.","id":"S3-46"},{"cat":"Conhecimentos Específicos","topic":"Segurança","q":"No Linux, o iptables é associado a","options":["edição de imagens Windows offline.","gerência exclusiva de usuários do AD.","criação de planilhas corporativas.","compilação de aplicativos Android.","regras de filtragem e tratamento de pacotes pelo Netfilter."],"answer":4,"why":"iptables gerencia regras de Netfilter em sistemas que o utilizam.","id":"S3-47"},{"cat":"Conhecimentos Específicos","topic":"Redes","q":"Um access point é destinado principalmente a","options":["substituir automaticamente o roteamento entre redes.","compilar linguagens de programação.","oferecer conectividade sem fio a dispositivos.","criar objetos de GPO.","realizar backups de bancos de dados."],"answer":2,"why":"Pontos de acesso fornecem serviço de rede wireless.","id":"S3-48"},{"cat":"Conhecimentos Específicos","topic":"Linux","q":"O Squid é frequentemente usado como","options":["servidor de políticas de grupo.","gerenciador de banco relacional.","hipervisor de máquinas Windows.","servidor proxy e cache de conteúdo web.","serviço de endereçamento DHCP."],"answer":3,"why":"Squid pode atuar como proxy e aplicar regras de acesso.","id":"S3-49"},{"cat":"Conhecimentos Específicos","topic":"Banco de dados","q":"Uma stored procedure é, em geral,","options":["um conjunto de instruções armazenado no SGBD e executado por chamada.","um tipo de autenticação do Active Directory.","um registro DNS de serviços SRV.","um formato de arquivo de imagem virtual.","um cabo usado em data centers."],"answer":0,"why":"Procedimentos armazenados encapsulam operações executadas no SGBD.","id":"S3-50"}]]</script>
<script>
'use strict';
const exams=JSON.parse(document.getElementById('bank').textContent);
const STORAGE='iprejun-training-v1';
const clean=()=>({sessions:[null,null,null],notes:{}});
function load(){try{const s=JSON.parse(localStorage.getItem(STORAGE));if(s && Array.isArray(s.sessions) && s.sessions.length===3)return s;}catch(e){}return clean();}
let state=load(),tab='home',active=0,current=0,storeOK=true;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){storeOK=false;}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function show(which){tab=which;document.querySelectorAll('.navbtn').forEach(x=>x.classList.toggle('active',x.id==='nav-'+which));render();window.scrollTo(0,0);}
function msformat(ms){const n=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(n/3600)).padStart(2,'0')}:${String(Math.floor(n%3600/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function duration(s){return (s.finishedAt||Date.now())-(s.startedAt||Date.now());}
function remaining(s){return 10800000-duration(s)}
function status(i){const s=state.sessions[i];return !s?'Não iniciado':s.finishedAt?'Concluído':'Em andamento'}
function start(i){if(!state.sessions[i]){state.sessions[i]={startedAt:Date.now(),finishedAt:null,mode:'timed',answers:Array(50).fill(null),doubts:Array(50).fill(false)};save();}active=i;current=state.sessions[i].answers.findIndex(v=>v===null);if(current<0)current=0;show('exam');}
function home(){const completed=state.sessions.filter(s=>s?.finishedAt).length;document.getElementById('view').innerHTML=`<div class="eyebrow">Seu laboratório de preparação</div><h1 class="heading">Estude com dados, não com achismos.</h1><p class="lead">Três avaliações inéditas de fundamentos, sem consulta e com a distribuição de disciplinas prevista no edital do IPREJUN. Ao final, identifique os temas mais frágeis e envie o diagnóstico para revisão no ChatGPT.</p><div class="grid">${[0,1,2].map(i=>`<div class="panel card"><span class="pill">Simulado ${i+1}</span><h3>${['Mapa inicial','Confirmação de lacunas','Comparação e consistência'][i]}</h3><p class="sub">50 questões · Português 10 · Matemática 10 · Lógica 5 · TI 25</p><div class="separator"></div><div class="row"><span class="status">${status(i)}</span><button class="btn primary" onclick="start(${i})">${status(i)==='Não iniciado'?'Iniciar':status(i)==='Concluído'?'Ver resultado':'Continuar'}</button></div></div>`).join('')}</div><div class="panel" style="margin-top:18px"><div class="eyebrow">Como usar os resultados</div><div class="two"><div><h3>Diagnóstico sem consulta</h3><p class="sub">Idealmente, faça uma prova por sessão. Não estude o gabarito dos outros antes de terminar os três testes.</p><div class="formula"><b>${completed}/3</b> simulados concluídos</div></div><div><h3>Não é nota de corte</h3><p class="sub">As questões são autorais, de dificuldade predominantemente introdutória. Servem para localizar lacunas, não para prever classificação ou substituir provas anteriores da VUNESP.</p></div></div></div><div class="foot">Programa-base: edital IPREJUN 015/2026, Anexo II; provas estimadas para 21/02/2027. O aplicativo funciona sem internet.</div>`}
function choose(index,choice){const s=state.sessions[active];if(!s||s.finishedAt)return;s.answers[index]=choice;save();render()}
function doubt(index,checked){const s=state.sessions[active];if(!s||s.finishedAt)return;s.doubts[index]=checked;save();render()}
function jump(i){current=i;render()}
function exam(){const s=state.sessions[active];if(!s){document.getElementById('view').innerHTML=`<h1 class="heading">Escolha um simulado</h1><div class="grid">${[0,1,2].map(i=>`<div class="panel"><h3>Simulado ${i+1}</h3><p class="sub">${status(i)}</p><button class="btn primary" onclick="start(${i})">Abrir</button></div>`).join('')}</div>`;return;}if(s.finishedAt){result(active);return;}if(s.mode==='timed'&&remaining(s)<=0){finish(true);return;}
const questions=exams[active],q=questions[current],answered=s.answers.filter(x=>x!==null).length,sel=s.answers[current];
document.getElementById('view').innerHTML=`<div class="row"><div><div class="eyebrow">Simulado ${active+1} de 3</div><h1 class="heading">Questão ${current+1} / 50</h1></div><div style="text-align:right"><div class="eyebrow">Tempo restante</div><div id="clock" style="font-size:25px;font-weight:800">${s.mode==='timed'?msformat(remaining(s)):'Sem limite'}</div></div></div><div class="measure"><i style="width:${answered*2}%"></i></div><div class="row" style="margin:10px 0 18px"><span class="sub">${answered} respondidas · ${50-answered} pendentes</span><span class="pill">${esc(q.cat)} · ${esc(q.topic)}</span></div><div class="panel"><h2 class="q-title">${esc(q.q)}</h2><div class="options">${q.options.map((opt,i)=>`<label class="opt ${sel===i?'selected':''}" onclick="choose(${current},${i})"><span class="letter">${'ABCDE'[i]}</span><span>${esc(opt)}</span></label>`).join('')}</div><label class="check"><input type="checkbox" ${s.doubts[current]?'checked':''} onchange="doubt(${current},this.checked)"/> Marcar como dúvida/chute (mesmo se acertar)</label><div class="separator"></div><div class="row"><button class="btn" onclick="jump(${Math.max(0,current-1)})" ${current===0?'disabled':''}>Anterior</button><button class="btn primary" onclick="jump(${Math.min(49,current+1)})" ${current===49?'disabled':''}>Próxima questão</button></div></div><div class="panel" style="margin-top:18px"><div class="eyebrow">Navegação pelas questões</div><div class="pager">${questions.map((it,i)=>`<button title="${esc(it.cat)} - ${esc(it.topic)}" class="number ${s.answers[i]!==null?'done':''} ${s.doubts[i]?'doubt':''} ${current===i?'current':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div><div class="separator"></div><div class="row"><span class="sub">As respostas serão exibidas somente após a finalização.</span><button class="btn danger" onclick="confirmFinish()">Finalizar e corrigir</button></div></div>`;
}
function confirmFinish(){const s=state.sessions[active];if(!s||s.finishedAt)return;let n=s.answers.filter(a=>a===null).length;if(confirm(n?`Você deixou ${n} questão(ões) em branco. Finalizar e corrigir agora?`:'Finalizar prova? As respostas serão reveladas.'))finish(false);}
function finish(auto){let s=state.sessions[active];if(!s||s.finishedAt)return;s.finishedAt=Date.now();s.auto=auto;save();render()}
function metrics(i){const s=state.sessions[i],q=exams[i];if(!s?.finishedAt)return null;let total=0,cats={},topics={};q.forEach((it,j)=>{const hit=s.answers[j]===it.answer;total+=hit?1:0;for(const [map,key] of [[cats,it.cat],[topics,it.topic]]){if(!map[key])map[key]={correct:0,total:0,doubts:0};map[key].total++;if(hit)map[key].correct++;if(s.doubts[j])map[key].doubts++;}});return{correct:total,cats,topics,passed:total>=25 && cats['Conhecimentos Específicos'].correct>0};}
function result(i){const s=state.sessions[i];if(!s?.finishedAt)return;const m=metrics(i);const keysReady=state.sessions.every(x=>x?.finishedAt);const categories=['Português','Matemática','Raciocínio Lógico','Conhecimentos Específicos'];document.getElementById('view').innerHTML=`<div class="row"><div><div class="eyebrow">Resultado do simulado ${i+1}</div><h1 class="heading">${m.correct}<span class="muted">/50</span> acertos</h1></div><span class="pill">${m.passed?'Habilitação mínima simulada':'Abaixo da habilitação mínima'}</span></div><p class="lead">Nota proporcional: <b>${m.correct*2}/100</b> · Tempo decorrido: ${msformat(duration(s))} · ${s.auto?'Encerrado por tempo':'Concluído manualmente'}. O mínimo de 25 acertos não equivale à classificação na única vaga.</p><div class="panel"><h3>Desempenho por disciplina</h3>${categories.map(cat=>{let z=m.cats[cat],pct=Math.round(z.correct/z.total*100);return`<div class="mini-row"><div><div class="row"><b>${cat}</b><span class="sub">${z.correct}/${z.total} · ${pct}%</span></div><div class="measure" style="margin-top:8px"><i style="width:${pct}%"></i></div></div><strong class="${pct>=75?'good':pct<50?'bad':'yellow'}">${pct}%</strong></div>`}).join('')}</div><div class="panel"><h3>Recorte por tópico</h3><p class="sub">Atenção: muitos tópicos têm apenas 1–3 questões por simulado; interprete esses dados com cautela.</p>${Object.entries(m.topics).sort((a,b)=>a[1].correct/a[1].total-b[1].correct/b[1].total).map(([topic,z])=>`<div class="mini-row"><div>${esc(topic)} <span class="tiny">${z.doubts?' · '+z.doubts+' marcada(s) com dúvida':''}</span></div><b>${z.correct}/${z.total}</b></div>`).join('')}</div>${keysReady?`<div class="panel"><div class="row"><h3>Revisão e explicações</h3><button class="btn small" onclick="downloadReport(${i})">Exportar JSON</button></div><p class="sub">Erros e questões marcadas como dúvida aparecem primeiro; depois é possível consultar as demais.</p>${exams[i].map((q,j)=>({q,j,wrong:s.answers[j]!==q.answer,doubt:s.doubts[j]})).sort((a,b)=>(b.wrong||b.doubt)-(a.wrong||a.doubt)).map(({q,j,wrong,doubt})=>`<div class="review"><div class="tiny">${q.id} · ${esc(q.topic)} ${doubt?'· marcou dúvida':''}</div><p><b>${esc(q.q)}</b></p><p class="${wrong?'bad':'good'}">Sua resposta: ${s.answers[j]===null?'Em branco':('ABCDE'[s.answers[j]]+' — '+esc(q.options[s.answers[j]]))}</p><p class="good">Correta: ${'ABCDE'[q.answer]} — ${esc(q.options[q.answer])}</p><p class="why">${esc(q.why)}</p></div>`).join('')}</div>`:`<div class="panel info"><b>Gabaritos reservados até concluir os três simulados.</b><p>Complete os três diagnósticos sem consultar o gabarito. Isso evita que uma prova influencie as próximas.</p></div>`}<div class="row" style="margin-top:18px"><button class="btn" onclick="show('home')">Voltar aos simulados</button><button class="btn primary" onclick="copyReport()">Copiar relatório para o ChatGPT</button></div>`;}
function reportText(){const lines=['DIAGNÓSTICO IPREJUN — ANALISTA INFORMÁTICA','Simulados de fundamentos autorais, não provas oficiais.',''];const agg={};state.sessions.forEach((s,i)=>{if(!s?.finishedAt)return;let m=metrics(i);lines.push(`Simulado ${i+1}: ${m.correct}/50; nota ${m.correct*2}/100; duração ${msformat(duration(s))}`);for(const [cat,v] of Object.entries(m.cats))lines.push(`  ${cat}: ${v.correct}/${v.total}`);for(const [topic,v] of Object.entries(m.topics)){agg[topic]??={right:0,total:0,doubts:0};agg[topic].right+=v.correct;agg[topic].total+=v.total;agg[topic].doubts+=v.doubts}lines.push('');});lines.push('RESULTADOS AGRUPADOS POR TEMA');Object.entries(agg).sort((a,b)=>a[1].right/a[1].total-b[1].right/b[1].total).forEach(([k,v])=>lines.push(`${k}: ${v.right}/${v.total}; dúvidas marcadas: ${v.doubts}`));lines.push('','Solicito análise dos pontos fracos, revisão por tópicos e questões inéditas após cada resumo.');return lines.join('\n');}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);alert('Texto copiado. Cole na nossa conversa.');}catch(e){const node=document.createElement('textarea');node.value=txt;document.body.appendChild(node);node.select();try{document.execCommand('copy');alert('Texto selecionado/copiado. Cole na conversa.')}catch(e2){prompt('Copie o texto:',txt)}node.remove();}}
function copyReport(){copyText(reportText())}
function downloadReport(i){const s=state.sessions[i];if(!s?.finishedAt||!state.sessions.every(x=>x?.finishedAt)){alert('O JSON detalhado será liberado após os três simulados.');return;}const payload={exam:i+1,date:new Date(s.finishedAt).toISOString(),answers:s.answers,doubts:s.doubts,questions:exams[i].map(({id,cat,topic,q,options,answer})=>({id,cat,topic,q,selected:s.answers[Number(id.split('-')[1])-1],correctAnswer:options[answer]})),metrics:metrics(i)};const b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=`iprejun-simulado-${i+1}-resultado.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function report(){const done=state.sessions.map((s,i)=>s?.finishedAt?i:null).filter(i=>i!==null);if(!done.length){document.getElementById('view').innerHTML=`<h1 class="heading">Meu desempenho</h1><div class="panel"><p class="empty">Complete ao menos um simulado para ver estatísticas.</p><button class="btn primary" onclick="show('home')">Ir aos simulados</button></div>`;return}
const total=done.reduce((n,i)=>n+metrics(i).correct,0);const agg={};done.forEach(i=>Object.entries(metrics(i).topics).forEach(([t,v])=>{agg[t]??={correct:0,total:0,doubts:0};agg[t].correct+=v.correct;agg[t].total+=v.total;agg[t].doubts+=v.doubts}));const weak=Object.entries(agg).sort((a,b)=>a[1].correct/a[1].total-b[1].correct/b[1].total).slice(0,8);document.getElementById('view').innerHTML=`<div class="eyebrow">Painel de progresso</div><h1 class="heading">Seu diagnóstico</h1><p class="lead">${done.length}/3 simulados concluídos · ${total}/${done.length*50} acertos no total · ${Math.round(total/(done.length*50)*100)}% de aproveitamento. Não use esse valor como estimativa de chance de aprovação.</p><div class="grid">${done.map(i=>`<div class="panel card"><div class="tiny">Simulado ${i+1}</div><div class="stat">${metrics(i).correct}/50</div><button class="btn small" onclick="active=${i};show('exam')">Ver correção</button></div>`).join('')}</div><div class="panel" style="margin-top:18px"><h3>Temas para revisar primeiro</h3><p class="sub">Lista ordenada pelos erros nas questões realizadas. Com poucos itens, considere também suas dúvidas declaradas.</p>${weak.map(([topic,v])=>`<div class="mini-row"><div>${esc(topic)} <span class="tiny">${v.doubts?`· ${v.doubts} dúvida(s)`:''}</span></div><b>${v.correct}/${v.total}</b></div>`).join('')}</div><div class="row" style="margin-top:18px"><button class="btn primary" onclick="copyReport()">Copiar diagnóstico</button><button class="btn" onclick="downloadAll()">Baixar relatório .txt</button></div>`}
function downloadAll(){const b=new Blob([reportText()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='iprejun-relatorio-diagnostico.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function summary(){const topics=['Redes / OSI / VLANs','Windows Server / Active Directory / GPO','Segurança / IDS / IPS / firewall','Linux / DNS / Protocolos','SQL / Views / Triggers / Stored Procedures','Hyper-V / Zabbix / Nagios / Squid / IPsec','Português','Matemática','Raciocínio Lógico'];let topic=state.notes.topic||topics[0];const content=state.notes[topic]||'';document.getElementById('view').innerHTML=`<div class="eyebrow">Aprendizado ativo</div><h1 class="heading">Seu resumo, depois o teste.</h1><p class="lead">Faça a primeira explicação sem consultar. Salve neste dispositivo e envie para o ChatGPT; aqui não existe correção por IA integrada.</p><div class="panel"><label class="label" for="topic">Assunto estudado</label><select class="btn" id="topic" onchange="topicChange(this.value)" style="max-width:100%;margin-bottom:18px">${topics.map(t=>`<option value="${esc(t)}" ${t===topic?'selected':''}>${esc(t)}</option>`).join('')}</select><label class="label" for="notes">Explique com suas palavras</label><textarea id="notes" oninput="noteUpdate(this.value)" placeholder="1) Definição: ...\n2) Como funciona e por quê: ...\n3) Exemplo prático: ...\n4) Diferença para conceitos próximos: ...\n5) Erro típico em questão de concurso: ...">${esc(content)}</textarea><div class="row" style="margin-top:15px"><span class="tiny">Salvo localmente neste navegador.</span><button class="btn primary" onclick="copyStudyPrompt()">Copiar para validação no ChatGPT</button></div></div><div class="panel" style="margin-top:18px"><h3>Como validar o aprendizado</h3><div class="formula">Explique → receba correção → responda 5 a 10 questões → classifique erros → revise em 1, 3, 7 e 14 dias.</div><p class="sub">A sequência 1/3/7/14 dias é uma sugestão organizacional, não um intervalo universalmente ótimo. Ajustaremos conforme seus acertos e recordação.</p></div>`;}
function topicChange(t){state.notes.topic=t;save();render()}
function noteUpdate(t){const key=state.notes.topic||'Redes / OSI / VLANs';state.notes[key]=t;save()}
function copyStudyPrompt(){const topic=state.notes.topic||'Redes / OSI / VLANs';const value=state.notes[topic]||'';if(!value.trim()){alert('Escreva primeiro sua explicação do assunto.');return;}copyText(`Estou me preparando para o concurso IPREJUN — Analista de Informática (VUNESP). Valide meu resumo sobre "${topic}" quanto à correção técnica, clareza e aderência ao edital. Identifique erros conceituais, lacunas e pontos que a VUNESP poderia cobrar. Reescreva somente as partes imprecisas e depois me aplique 10 questões inéditas de múltipla escolha, SEM mostrar gabarito antes de eu responder.\n\nMEU RESUMO:\n${value}`)}
function render(){({home,exam,report,summary}[tab])();}
setInterval(()=>{const s=state.sessions[active];if(tab!=='exam'||!s||s.finishedAt)return;if(s.mode==='timed'&&remaining(s)<=0){finish(true);return;}const c=document.getElementById('clock');if(c)c.textContent=s.mode==='timed'?msformat(remaining(s)):'Sem limite'},1000);
render();
</script></body></html>
